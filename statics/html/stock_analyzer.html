<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票AI分析提示词生成器</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        h1 {
            color: #34495e;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #95a5a6;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #34495e;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-suffix {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7f8c8d;
            font-size: 16px;
            font-weight: 700;
            pointer-events: none;
        }

        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 6px;
            font-size: 16px;
            color: #34495e;
            transition: all 0.3s ease;
            font-family: 'Lato', sans-serif;
        }

        input[type="number"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        #growth {
            padding-right: 40px;
        }

        .hint {
            color: #95a5a6;
            font-size: 12px;
            margin-top: 5px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .radio-label:hover {
            border-color: #3498db;
            background: #f8f9fa;
        }

        .radio-label input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3498db;
        }

        .radio-label input[type="radio"]:checked + .radio-text {
            color: #3498db;
            font-weight: 700;
        }

        .radio-label:has(input[type="radio"]:checked) {
            border-color: #3498db;
            background: rgba(52, 152, 219, 0.05);
        }

        .radio-text {
            color: #34495e;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .query-button {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%) !important;
            font-size: 14px !important;
            padding: 12px 20px !important;
            margin: 0 !important;
            width: auto !important;
            min-width: 80px;
            transition: all 0.3s ease;
        }

        .query-button:hover:not(:disabled) {
            background: linear-gradient(135deg, #c0392b 0%, #a93226 100%) !important;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.4) !important;
        }


        @media (max-width: 768px) {
            .container {
                padding: 20px;
                max-height: none;
            }
            
            h1 {
                font-size: 24px;
            }
        }
        
        /* Prompt显示区域样式 */
        #llmPrompt {
            scrollbar-width: thin;
            scrollbar-color: #bdc3c7 #ecf0f1;
        }
        
        #llmPrompt::-webkit-scrollbar {
            width: 8px;
        }
        
        #llmPrompt::-webkit-scrollbar-track {
            background: #ecf0f1;
            border-radius: 4px;
        }
        
        #llmPrompt::-webkit-scrollbar-thumb {
            background: #bdc3c7;
            border-radius: 4px;
        }
        
        #llmPrompt::-webkit-scrollbar-thumb:hover {
            background: #95a5a6;
        }

    </style>
</head>
<body>
<div class="app-container">
    <!-- 股票分析器 -->
    <div class="container">
        <h1>🤖 股票AI分析提示词生成器</h1>
        <p class="subtitle">输入股票名称或代码，自动生成包含详细财务数据的AI分析提示词</p>

        <div class="input-group">
            <label for="stockName">股票名称</label>
            <div class="input-wrapper" style="display: flex; gap: 10px;">
                <input type="text" id="stockName" placeholder="例如: 贵州茅台" style="flex: 1;">
                <button type="button" id="queryBtn" class="query-button" onclick="queryStockData()">
                    🔍 查询
                </button>
            </div>
            <div class="hint">输入股票名称或代码，系统将自动查询并生成包含完整财务数据的AI分析提示词</div>
        </div>

        <!-- 股票基础信息展示区域 -->
        <div id="stockInfoContainer" style="margin-top: 30px;"></div>

        <!-- AI提示词区域 -->
        <div id="promptContainer" style="margin-top: 30px; display: none;">
            <div style="background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15); padding: 25px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="margin: 0; color: #34495e; font-size: 20px; font-weight: 700;">🤖 AI分析提示词</h3>
                    <button type="button" id="copyBtn" onclick="copyPrompt()" style="width: 200px;background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 700; transition: all 0.3s ease;" onmouseover="this.style.background='#27ae60'; this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(40,167,69,0.4)'" onmouseout="this.style.background='#28a745'; this.style.transform=''; this.style.boxShadow=''">
                        📋 一键复制
                    </button>
                </div>
                <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; position: relative;">
                    <div style="font-size: 12px; color: #6c757d; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                        <span>💡</span>
                        <span>请复制以下提示词到ChatGPT、Claude、Kimi等AI工具中进行多维度分析</span>
                    </div>
                    <pre id="llmPrompt" style="margin: 0; padding: 0; background: transparent; border: none; font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-size: 13px; line-height: 1.8; color: #2c3e50; white-space: pre-wrap; word-wrap: break-word; overflow-x: auto; max-height: 600px; overflow-y: auto;"></pre>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
    let currentStockData = null;

    // 清空之前的结果
    function clearPreviousResults() {
        // 清空股票基础信息
        document.getElementById('stockInfoContainer').innerHTML = '';
        
        // 隐藏AI提示词区域
        document.getElementById('promptContainer').style.display = 'none';
        
        // 清空当前股票数据
        currentStockData = null;
    }


    function queryStockData() {
        const stockName = document.getElementById('stockName').value.trim();
        if (!stockName) {
            alert('请输入股票名称或代码！');
            return;
        }

        // 清空之前的结果
        clearPreviousResults();

        const queryBtn = document.getElementById('queryBtn');
        const originalText = queryBtn.innerHTML;
        queryBtn.innerHTML = '⏳ 查询中...';
        queryBtn.disabled = true;

        fetch(`/invest/query-stock?keyword=${encodeURIComponent(stockName)}`)
            .then(response => response.json())
            .then(data => {
                if (data.Error) {
                    alert('查询失败: ' + data.Error);
                    return;
                }

                if (data.StockData) {
                    const stock = data.StockData;
                    // 保存当前股票数据
                    currentStockData = stock;
                    
                    // 更新股票名称（使用查询到的标准名称）
                    document.getElementById('stockName').value = stock.name;
                    
                    // 显示股票基础信息
                    showStockBasicInfo(stock);
                    
                    // 显示LLM prompt
                    showLLMPrompt(stock.llm_prompt);
                    
                    // 显示AI提示词区域
                    document.getElementById('promptContainer').style.display = 'block';
                    
                } else {
                    alert('未找到相关股票数据');
                }
            })
            .catch(error => {
                console.error('查询错误:', error);
                alert('查询失败，请稍后重试');
            })
            .finally(() => {
                queryBtn.innerHTML = originalText;
                queryBtn.disabled = false;
            });
    }

    function showStockBasicInfo(stock) {
        const container = document.getElementById('stockInfoContainer');
        
        container.innerHTML = `
            <div style="background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15); overflow: hidden;">
                <!-- 股票基本信息 -->
                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h2 style="margin: 0; font-size: 24px; font-weight: 700;">${stock.name}</h2>
                        <div style="background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px; font-size: 14px;">
                            ${stock.code}
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; font-size: 14px;">
                        <div><strong>行业:</strong> ${stock.industry || '未知'}</div>
                        <div><strong>当前价格:</strong> ${stock.current_price || '未知'}</div>
                        <div><strong>市值:</strong> ${stock.market_cap ? (stock.market_cap / 100000000).toFixed(2) + '亿元' : '未知'}</div>
                        <div><strong>PE:</strong> ${stock.pe ? stock.pe.toFixed(2) : '未知'}</div>
                        <div><strong>净利润增长率:</strong> ${stock.growth ? stock.growth.toFixed(2) + '%' : '未知'}</div>
                    </div>
                </div>
            </div>
        `;
    }

    function showLLMPrompt(prompt) {
        const promptElement = document.getElementById('llmPrompt');
        promptElement.textContent = prompt;
    }

    function copyPrompt() {
        const promptElement = document.getElementById('llmPrompt');
        const text = promptElement.textContent || promptElement.innerText;
        
        // 使用现代 Clipboard API
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showCopySuccess();
            }).catch(() => {
                // 降级到传统方法
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showCopySuccess();
        } catch (err) {
            alert('复制失败，请手动选择文本复制');
        }
        document.body.removeChild(textarea);
    }

    function showCopySuccess() {
        const button = document.getElementById('copyBtn');
        if (!button) return;
        
        const originalText = button.innerHTML;
        button.innerHTML = '✅ 已复制';
        button.style.background = '#27ae60';
        button.style.transform = '';
        button.style.boxShadow = '';
        
        setTimeout(() => {
            button.innerHTML = originalText;
            button.style.background = '#28a745';
        }, 2000);
    }



    document.querySelectorAll('input[type="text"]').forEach(input => {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                queryStockData();
            }
        });
    });

    // 页面加载时检查URL参数
    function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const queryParam = urlParams.get('q');
        
        if (queryParam) {
            // 解码URL参数（处理中文等特殊字符）
            const decodedQuery = decodeURIComponent(queryParam);
            
            // 填充到股票名称输入框
            const nameInput = document.getElementById('stockName');
            if (nameInput) {
                nameInput.value = decodedQuery;
            }
            
            // 自动触发查询
            queryStockData();
        }
    }

    // 页面加载完成后执行初始化
    document.addEventListener('DOMContentLoaded', function() {
        init();
    });
</script>
</body>
</html>
