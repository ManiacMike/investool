<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票笔记 - 优势与风险分析</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 输入框的定制主题红色 (优势) */
        .theme-red textarea {
            color: #b91c1c; /* text-red-700 */
        }
        .theme-red textarea::placeholder {
            color: #f7a5a5;
        }

        /* 输入框定制主题绿色 (风险) */
        .theme-green textarea {
            color: #047857; /* text-emerald-700 */
        }
        .theme-green textarea::placeholder {
            color: #6ee7b7;
        }

        /* Glassmorphism 卡片效果 */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="text-[#1e293b] min-h-screen relative pb-10 selection:bg-indigo-100 selection:text-indigo-900">
    
    <!-- 顶部背景装饰 -->
    <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-br from-indigo-50 via-white to-blue-50 -z-10 overflow-hidden">
        <div class="absolute top-[-50px] right-[-50px] w-96 h-96 bg-indigo-200/40 blur-[80px] rounded-full mix-blend-multiply"></div>
        <div class="absolute top-[20px] left-[-20px] w-72 h-72 bg-blue-200/40 blur-[80px] rounded-full mix-blend-multiply"></div>
    </div>

    <div class="max-w-[1600px] mx-auto p-4 md:p-8 space-y-6">
        
        <!-- Header 区域 -->
        <header class="flex items-center justify-between bg-white/60 backdrop-blur-md rounded-2xl p-4 shadow-sm border border-white/50 sticky top-4 z-50 fade-in">
            <div class="flex items-center gap-4">
                <button onclick="window.close()" class="p-2 hover:bg-gray-100/80 rounded-xl transition-all text-gray-400 hover:text-gray-700 shadow-sm border border-transparent hover:border-gray-200">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div>
                    <h1 class="text-2xl font-extrabold flex items-center gap-3 tracking-tight">
                        <span id="stock-name" class="bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-600">加载中...</span>
                        <span id="stock-code" class="text-sm px-2.5 py-1 bg-white border border-gray-200 rounded-lg text-gray-500 font-mono shadow-sm">---</span>
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="save-status" class="text-xs font-medium text-gray-400 opacity-0 transition-opacity">已保存</div>
                <button onclick="saveNotes(true)" class="flex items-center gap-2 px-5 py-2.5 bg-gray-900 hover:bg-black text-white rounded-xl shadow-lg shadow-gray-900/20 transition-all font-semibold active:scale-95">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    保存笔记
                </button>
            </div>
        </header>

        <!-- 极简财务检测数据区 -->
        <main class="space-y-6">
            <!-- Checker 模块 -->
            <section class="glass-card rounded-2xl shadow-sm border border-gray-100 p-6 fade-in" style="animation-delay: 0.1s;">
                <div class="flex items-center justify-between mb-5 pb-3 border-b border-gray-100 cursor-pointer group" onclick="toggleChecker()">
                    <div class="flex items-center gap-2">
                        <div class="bg-indigo-50 p-2 rounded-lg text-indigo-500">
                            <i data-lucide="activity" class="w-4 h-4"></i>
                        </div>
                        <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wider">核心基本面检测 (Checker)</h2>
                        <span id="checker-status-badge" class="ml-2"></span>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="refreshCheckerData(event)" class="text-gray-400 hover:text-indigo-600 transition-colors p-1.5 rounded-lg hover:bg-indigo-50" title="重新获取检测数据">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        </button>
                        <i data-lucide="chevron-up" id="checker-chevron" class="w-5 h-5 text-gray-400 transition-transform duration-200"></i>
                    </div>
                </div>
                
                <div id="checker-content" class="transition-all duration-300 origin-top">
                    <!-- 加载占位符 -->
                    <div id="checker-loading" class="flex flex-col items-center justify-center py-10 opacity-60 hidden">
                        <i data-lucide="loader-2" class="w-6 h-6 text-indigo-400 animate-spin mb-2"></i>
                        <span class="text-xs text-gray-400 font-medium tracking-widest uppercase">Fetching Data...</span>
                    </div>

                    <!-- 数据容器 -->
                    <div id="checker-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 hidden">
                        <!-- JS 生成 -->
                    </div>
                </div>
            </section>

            <!-- 左右优势与风险区块 -->
            <section class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-[600px] fade-in" style="animation-delay: 0.2s;">
                
                <!-- 优势 (绿) -->
                <div class="flex flex-col rounded-2xl bg-white border border-[#a7f3d0] shadow-sm shadow-emerald-100/50 overflow-hidden theme-green group focus-within:shadow-md focus-within:shadow-emerald-200 focus-within:border-emerald-300 transition-all">
                    <div class="p-4 bg-gradient-to-b from-emerald-50 to-white flex items-center justify-between border-b border-emerald-100">
                        <div class="flex items-center gap-2">
                            <div class="p-2 bg-emerald-100 rounded-lg text-emerald-600">
                                <i data-lucide="flame" class="w-4 h-4"></i>
                            </div>
                            <h3 class="font-bold text-emerald-800 text-base tracking-wide flex flex-col">
                                投资优势 (Strengths)
                                <span class="text-[10px] text-emerald-500 font-medium">看多逻辑 / 催化剂 / 护城河</span>
                            </h3>
                        </div>
                    </div>
                    <div class="flex-1 p-2 relative">
                        <textarea id="note-strengths" class="w-full h-full p-4 resize-none bg-transparent outline-none text-sm md:text-base leading-relaxed" placeholder="写下它的核心优势...例如：
1. 行业绝对龙头，市占率 第一
2. 新产品发布带来业绩加速
3. 财务状况极佳，自由现金流充沛..."></textarea>
                        <!-- 底部发光装饰 -->
                        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-emerald-300 to-transparent opacity-0 group-focus-within:opacity-100 transition-opacity"></div>
                    </div>
                </div>

                <!-- 风险 (红) -->
                <div class="flex flex-col rounded-2xl bg-white border border-[#fecaca] shadow-sm shadow-red-100/50 overflow-hidden theme-red group focus-within:shadow-md focus-within:shadow-red-200 focus-within:border-red-300 transition-all">
                    <div class="p-4 bg-gradient-to-b from-red-50 to-white flex items-center justify-between border-b border-red-100">
                        <div class="flex items-center gap-2">
                            <div class="p-2 bg-red-100 rounded-lg text-red-600">
                                <i data-lucide="shield-alert" class="w-4 h-4"></i>
                            </div>
                            <h3 class="font-bold text-red-800 text-base tracking-wide flex flex-col">
                                潜在风险 (Risks)
                                <span class="text-[10px] text-red-400 font-medium">看空逻辑 / 鬼故事 / 避险提醒</span>
                            </h3>
                        </div>
                    </div>
                    <div class="flex-1 p-2 relative">
                        <textarea id="note-risks" class="w-full h-full p-4 resize-none bg-transparent outline-none text-sm md:text-base leading-relaxed" placeholder="这里记录随时可能引爆的风险...例如：
1. 估值偏高，目前 PEG > 2
2. 同行业竞争加剧，毛利率有下滑趋势
3. 大股东存在质押风险..."></textarea>
                        <!-- 底部发光装饰 -->
                        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-red-300 to-transparent opacity-0 group-focus-within:opacity-100 transition-opacity"></div>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <!-- JavaScript Base Logic -->
    <script>
        // 1. 初始化
        lucide.createIcons();

        // 提取 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const stockCode = urlParams.get('code') || '';
        let stockName = urlParams.get('name') || '';

        // DOM 元素
        const elName = document.getElementById('stock-name');
        const elCode = document.getElementById('stock-code');
        const elStrengths = document.getElementById('note-strengths');
        const elRisks = document.getElementById('note-risks');
        const elSaveStatus = document.getElementById('save-status');
        
        let saveTimeout;

        // 本地存储键
        const LS_KEY_STRENGTHS = `zenNote_strengths_${stockCode}`;
        const LS_KEY_RISKS = `zenNote_risks_${stockCode}`;
        const LS_KEY_CHECKER = `zenNote_checker_${stockCode}`;

        document.addEventListener('DOMContentLoaded', () => {
            if (!stockCode) {
                elName.textContent = "未指定股票";
                return;
            }
            // 填充顶部文字
            if(stockName) elName.textContent = stockName;
            elCode.textContent = stockCode;

            // 加载本地笔记
            loadNotes();
            
            // 自动保存绑定
            elStrengths.addEventListener('input', triggerAutoSave);
            elRisks.addEventListener('input', triggerAutoSave);

            // 初始化 Checker 数据
            initChecker();
        });

        // 2. 笔记读写逻辑
        function loadNotes() {
            const savedStr = localStorage.getItem(LS_KEY_STRENGTHS);
            const savedRisk = localStorage.getItem(LS_KEY_RISKS);
            if(savedStr) elStrengths.value = savedStr;
            if(savedRisk) elRisks.value = savedRisk;
        }

        function triggerAutoSave() {
            clearTimeout(saveTimeout);
            elSaveStatus.style.opacity = '0';
            saveTimeout = setTimeout(() => saveNotes(false), 800); // 防抖 800ms
        }

        function saveNotes(manual = false) {
            localStorage.setItem(LS_KEY_STRENGTHS, elStrengths.value);
            localStorage.setItem(LS_KEY_RISKS, elRisks.value);
            
            elSaveStatus.textContent = manual ? '保存成功!' : '已自动保存';
            elSaveStatus.style.opacity = '1';
            
            if (manual) {
                // 如果是手动保存可以给出明显的确认反馈
                const iconHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 inline-block align-text-bottom text-green-500 mr-1"></i>`;
                elSaveStatus.innerHTML = `${iconHTML} 保存成功!`;
                lucide.createIcons();
            }

            setTimeout(() => {
                elSaveStatus.style.opacity = '0';
            }, 2500);
        }

        // 3. Checker 数据请求与渲染
        function initChecker() {
            if (!stockCode) return;
            const cachedData = localStorage.getItem(LS_KEY_CHECKER);
            if (cachedData) {
                try {
                    const parsedData = JSON.parse(cachedData);
                    document.getElementById('checker-loading').classList.add('hidden');
                    const grid = document.getElementById('checker-grid');
                    grid.classList.remove('hidden');
                    renderCheckerGrid(parsedData);
                } catch(e) {
                    fetchCheckerData(stockCode);
                }
            } else {
                fetchCheckerData(stockCode);
            }
        }
        
        function toggleChecker() {
            const content = document.getElementById('checker-content');
            const chevron = document.getElementById('checker-chevron');
            if (content.classList.contains('hidden') || content.style.display === 'none') {
                content.style.display = 'block';
                content.classList.remove('hidden');
                chevron.style.transform = 'rotate(0deg)';
            } else {
                content.style.display = 'none';
                content.classList.add('hidden');
                chevron.style.transform = 'rotate(180deg)';
            }
        }
        
        function refreshCheckerData(e) {
            e.stopPropagation();
            fetchCheckerData(stockCode);
        }

        async function fetchCheckerData(code) {
            try {
                // 显示加载状态
                document.getElementById('checker-grid').classList.add('hidden');
                document.getElementById('checker-loading').classList.remove('hidden');
                document.getElementById('checker-status-badge').innerHTML = '';

                // 构建 formData 后台接收
                const formData = new FormData();
                formData.append("checker_keyword", code);
                
                const response = await fetch('/checker', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                document.getElementById('checker-loading').classList.add('hidden');
                const grid = document.getElementById('checker-grid');
                grid.classList.remove('hidden');
                
                if (data.Error && data.Error !== "") {
                    grid.innerHTML = `<div class="col-span-full py-4 text-center text-red-500 bg-red-50 rounded-xl text-sm font-medium border border-red-100 flex items-center justify-center gap-2">
                        <i data-lucide="alert-circle" class="w-4 h-4"></i> 获取数据失败：${data.Error}
                    </div>`;
                    lucide.createIcons();
                    return;
                }

                if (data.Results && data.Results.length > 0) {
                    // 更新名字 (应对URL无名字的情况)
                    if(!stockName && data.StockNames && data.StockNames.length > 0) {
                        stockName = data.StockNames[0].split('-')[0];
                        elName.textContent = stockName;
                    }
                    
                    const resultObj = data.Results[0];
                    localStorage.setItem(LS_KEY_CHECKER, JSON.stringify(resultObj)); // 缓存结果
                    renderCheckerGrid(resultObj);
                } else {
                    grid.innerHTML = `<div class="col-span-full text-center text-gray-500 text-sm py-4">无检测数据</div>`;
                }
            } catch (err) {
                document.getElementById('checker-loading').classList.add('hidden');
                console.error("Fetcher error:", err);
            }
        }

        function renderCheckerGrid(resultData) {
            const grid = document.getElementById('checker-grid');
            let html = '';
            
            let total = 0;
            let passed = 0;

            for (const [key, item] of Object.entries(resultData)) {
                total++;
                const isOk = item.ok === "true";
                if (isOk) passed++;
                
                const statusColor = isOk ? 'text-green-600 bg-green-50 border border-green-200' : 'text-red-600 bg-red-50 border border-red-200';
                const icon = isOk ? 'check-circle' : 'x-circle';
                const hoverBorder = isOk ? 'hover:border-green-300 hover:shadow-green-100' : 'hover:border-red-300 hover:shadow-red-100';

                // 将后台可能存在的 br 标签替换成单纯的文字显示或者保留格式
                const descText = item.desc.replace(/<br\s*\/?>/gi, ' | ');

                html += `
                    <div class="px-4 py-3 rounded-xl transition-all duration-300 shadow-sm ${statusColor} ${hoverBorder} hover:shadow-md hover:-translate-y-0.5 group">
                        <div class="flex items-center gap-2 mb-2">
                            <i data-lucide="${icon}" class="w-4 h-4 mt-0.5 shadow-sm rounded-full bg-white flex-shrink-0"></i>
                            <h4 class="font-bold text-sm truncate tracking-tight" title="${key}">${key}</h4>
                        </div>
                        <div class="text-[11px] leading-relaxed opacity-90 font-medium pl-6 line-clamp-3 group-hover:line-clamp-none max-h-min break-all">
                            ${descText}
                        </div>
                    </div>
                `;
            }

            grid.innerHTML = html;
            
            // 渲染右侧通过率Badge
            const passRate = total === 0 ? 0 : Math.round((passed/total)*100);
            const badgeEl = document.getElementById('checker-status-badge');
            
            let rateBg = 'bg-red-100 text-red-700 border border-red-200';
            if (passRate >= 80) rateBg = 'bg-emerald-100 text-emerald-700 border border-emerald-200';
            else if (passRate >= 50) rateBg = 'bg-amber-100 text-amber-700 border border-amber-200';
            
            badgeEl.innerHTML = `<span class="px-2 py-0.5 text-xs font-bold rounded-md ${rateBg}">通过率: ${passRate}% (${passed}/${total})</span>`;
            
            lucide.createIcons();
        }
    </script>
</body>
</html>
