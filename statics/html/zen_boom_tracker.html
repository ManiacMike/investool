<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>景气行业追踪</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-enter { animation: modalIn 0.2s ease-out forwards; }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f9fafb] text-[#111827] min-h-screen selection:bg-[#6366f1]/20 selection:text-[#3730a3]">

    <div class="max-w-[min(100%,2000px)] mx-auto p-4 md:px-6 lg:px-8 py-8">

        <!-- Header -->
        <header class="mb-8 flex flex-col items-center">
            <div class="flex items-center gap-3 mb-2">
                <div class="bg-gradient-to-br from-[#6366f1] to-[#4f46e5] p-2.5 rounded-xl shadow-lg shadow-[#6366f1]/30">
                    <i data-lucide="trending-up" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-[#111827] tracking-tight">景气行业追踪</h1>
            </div>
            <p class="text-[#6b7280] font-medium text-sm">景气为纲 · 情绪定仓 · 龙头与弹性并举</p>
            <p class="text-[#9ca3af] text-xs mt-2 flex items-center gap-1.5">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                在 Claude Code 中运行 <code class="bg-[#eef2ff] text-[#4338ca] px-1.5 py-0.5 rounded font-mono">/boom-advisor</code> 生成仓位与交易指引
                <a href="/invest/boom-scores" class="ml-3 text-[#4f46e5] hover:underline flex items-center gap-1"><i data-lucide="clipboard-check" class="w-3.5 h-3.5"></i>评分报告</a>
            </p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

            <!-- 左侧主区 -->
            <div class="lg:col-span-3 flex flex-col gap-6">

                <!-- 交易指引 -->
                <div class="bg-white rounded-2xl shadow-sm border border-[#e5e7eb] overflow-hidden">
                    <div class="p-5 border-b border-[#e5e7eb] bg-[#f9fafb] flex items-center justify-between">
                        <h3 class="text-base font-bold text-[#111827] flex items-center gap-2">
                            <span class="w-1 h-5 bg-[#f59e0b] rounded-full"></span>
                            交易指引
                            <span id="advice-count-badge" class="hidden text-[10px] font-bold text-white bg-[#f59e0b] rounded-full px-2 py-0.5">0</span>
                        </h3>
                        <span class="text-xs text-[#9ca3af]" id="advice-generated-at"></span>
                    </div>
                    <div id="advice-list" class="p-5 grid grid-cols-1 md:grid-cols-2 gap-3">
                        <!-- 建议卡片 JS 渲染 -->
                    </div>
                </div>

                <!-- 板块与持仓 -->
                <div class="flex items-center justify-between">
                    <h3 class="text-base font-bold text-[#111827] flex items-center gap-2">
                        <span class="w-1 h-5 bg-[#6366f1] rounded-full"></span>
                        板块与股票池
                    </h3>
                    <div class="flex items-center gap-2">
                        <button onclick="refreshPrices()" class="flex items-center gap-1.5 bg-white hover:bg-[#f9fafb] text-[#6b7280] hover:text-[#6366f1] px-3 py-2 rounded-lg text-sm font-medium transition-all border border-[#e5e7eb] hover:border-[#6366f1]">
                            <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="refresh-icon"></i>
                            <span>刷新价格</span>
                        </button>
                        <button onclick="openSectorModal()" class="flex items-center gap-1.5 bg-[#6366f1] hover:bg-[#4f46e5] text-white px-3 py-2 rounded-lg text-sm font-medium transition-all shadow-lg shadow-[#6366f1]/20 active:translate-y-0.5">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                            <span>新增板块</span>
                        </button>
                    </div>
                </div>

                <div id="sector-list" class="grid grid-cols-1 xl:grid-cols-2 gap-6 items-start">
                    <!-- 板块卡片 JS 渲染 -->
                </div>
            </div>

            <!-- 右侧统计区 -->
            <div class="lg:col-span-1 space-y-6">

                <!-- 仓位水位 -->
                <div class="bg-gradient-to-br from-[#1f2937] to-[#111827] text-white rounded-2xl p-6 shadow-xl shadow-[#111827]/20 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-40 h-40 bg-[#6366f1]/10 rounded-full -translate-y-1/2 translate-x-1/3 blur-3xl"></div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="p-3 bg-white/5 backdrop-blur-sm rounded-xl border border-white/10">
                                <i data-lucide="gauge" class="w-6 h-6 text-[#818cf8]"></i>
                            </div>
                            <p class="text-[#9ca3af] text-xs font-bold uppercase tracking-wider">总仓位水位</p>
                        </div>

                        <div class="flex items-baseline gap-2 mb-1">
                            <p class="text-3xl font-bold tracking-tight text-white" id="current-position-pct">--%</p>
                            <p class="text-xs text-[#9ca3af]">当前</p>
                        </div>
                        <div class="flex items-baseline gap-2 mb-4">
                            <p class="text-xl font-bold text-[#818cf8]" id="target-position-pct">--%</p>
                            <p class="text-xs text-[#9ca3af]">目标（AI 建议）</p>
                        </div>

                        <!-- 水位条 -->
                        <div class="relative h-3 bg-white/10 rounded-full mb-5 overflow-visible">
                            <div id="position-bar" class="absolute left-0 top-0 h-3 bg-gradient-to-r from-[#6366f1] to-[#818cf8] rounded-full transition-all duration-500" style="width:0%"></div>
                            <div id="target-marker" class="absolute -top-1 h-5 w-0.5 bg-[#fbbf24] rounded transition-all duration-500 hidden" style="left:0%">
                                <div class="absolute -top-0.5 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-[#fbbf24] rotate-45"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-white/10">
                            <div>
                                <p class="text-[#9ca3af] text-[10px] uppercase tracking-wider mb-1 font-bold">总资产</p>
                                <p class="text-sm font-bold text-white" id="total-asset-display">¥0</p>
                            </div>
                            <div>
                                <p class="text-[#9ca3af] text-[10px] uppercase tracking-wider mb-1 font-bold">市场温度</p>
                                <p class="text-sm font-bold" id="market-temp-display">--</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 板块分布 -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-[#e5e7eb]">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="p-2 rounded-lg bg-[#eef2ff] text-[#6366f1]">
                            <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                        </div>
                        <h4 class="font-bold text-[#111827] text-sm">板块分布 <span class="text-[#9ca3af] font-normal text-xs">(当前 vs 目标)</span></h4>
                    </div>
                    <div id="sector-distribution" class="space-y-3">
                        <!-- JS 渲染 -->
                    </div>
                </div>

                <!-- AI 总结 -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-[#e5e7eb]">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="p-2 rounded-lg bg-[#fef3c7] text-[#b45309]">
                            <i data-lucide="brain" class="w-4 h-4"></i>
                        </div>
                        <h4 class="font-bold text-[#111827] text-sm">AI 总结</h4>
                    </div>
                    <div id="ai-summary" class="text-xs text-[#4b5563] leading-relaxed whitespace-pre-wrap">暂无总结，运行 /boom-advisor 生成。</div>
                    <p id="ai-summary-time" class="text-[10px] text-[#9ca3af] mt-3 pt-3 border-t border-[#f3f4f6]"></p>
                </div>

                <!-- 资金与备注 -->
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-[#e5e7eb]">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="p-2 rounded-lg bg-[#d1fae5] text-[#047857]">
                            <i data-lucide="wallet" class="w-4 h-4"></i>
                        </div>
                        <h4 class="font-bold text-[#111827] text-sm">资金与备注</h4>
                    </div>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-[10px] font-bold text-[#6b7280] uppercase tracking-wider mb-1">当前现金（元）</label>
                            <input type="number" id="setting-cash" min="0" step="0.01" class="w-full px-3 py-2 bg-white border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#10b981] text-sm font-mono font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-[#6b7280] uppercase tracking-wider mb-1">单板块上限（%）</label>
                            <input type="number" id="setting-max-sector" min="10" max="100" step="1" class="w-full px-3 py-2 bg-white border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#10b981] text-sm font-mono font-medium">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-[#6b7280] uppercase tracking-wider mb-1">主观备注（给 AI 参考：市场观察 / 产业变化 / 外盘）</label>
                            <textarea id="setting-notes" rows="4" placeholder="例如：北美云厂资本开支超预期；港股流动性转暖…" class="w-full px-3 py-2 bg-white border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#10b981] text-xs leading-relaxed"></textarea>
                        </div>
                        <button onclick="saveSettings()" class="w-full flex items-center justify-center gap-2 bg-[#10b981] hover:bg-[#059669] text-white px-4 py-2.5 rounded-lg font-semibold text-sm transition-all shadow-md shadow-[#10b981]/20 active:translate-y-0.5">
                            <i data-lucide="save" class="w-4 h-4"></i>
                            <span>保存设置</span>
                        </button>
                    </div>
                </div>

                <!-- 历史建议 -->
                <div class="bg-white rounded-2xl shadow-sm border border-[#e5e7eb] overflow-hidden">
                    <button onclick="toggleHistory()" class="w-full p-5 flex items-center justify-between hover:bg-[#f9fafb] transition-colors">
                        <div class="flex items-center gap-2">
                            <div class="p-2 rounded-lg bg-[#f3f4f6] text-[#6b7280]">
                                <i data-lucide="history" class="w-4 h-4"></i>
                            </div>
                            <h4 class="font-bold text-[#111827] text-sm">历史建议</h4>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-[#9ca3af]" id="history-chevron"></i>
                    </button>
                    <div id="history-list" class="hidden px-5 pb-5 space-y-2 max-h-80 overflow-y-auto no-scrollbar">
                        <!-- JS 渲染 -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 板块 Modal -->
    <div id="sector-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-[#1f2937]/70 backdrop-blur-sm" onclick="closeSectorModal()"></div>
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md relative z-10 overflow-hidden modal-enter border border-[#e5e7eb]">
            <div class="p-4 border-b border-[#e5e7eb] flex justify-between items-center bg-[#f9fafb]">
                <h3 id="sector-modal-title" class="text-base font-bold text-[#111827] flex items-center gap-2">
                    <div class="bg-[#eef2ff] p-1.5 rounded-lg text-[#6366f1]"><i data-lucide="layers" class="w-4 h-4"></i></div>
                    新增板块
                </h3>
                <button onclick="closeSectorModal()" class="text-[#9ca3af] hover:text-[#4b5563] hover:bg-[#e5e7eb] p-1.5 rounded-full transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <form onsubmit="handleSaveSector(event)" class="p-5 space-y-4">
                <input type="hidden" id="sector-edit-id" value="">
                <div>
                    <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider mb-1">板块名称 <span class="text-[#ef4444]">*</span></label>
                    <input type="text" id="sector-name" required placeholder="如：AI 算力 / 创新药 / 人形机器人" class="w-full px-3 py-2 border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6366f1] text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider mb-1">景气逻辑（未来 2~3 年的核心逻辑）</label>
                    <textarea id="sector-thesis" rows="3" placeholder="如：全球 AI 资本开支持续上行，光模块量价齐升…" class="w-full px-3 py-2 border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6366f1] text-xs leading-relaxed"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider mb-2">当前景气预期</label>
                    <div class="grid grid-cols-3 gap-2" id="sector-expectation-group">
                        <button type="button" onclick="selectExpectation('up')" data-value="up" class="expectation-btn px-3 py-2 rounded-lg border-2 border-[#e5e7eb] text-xs font-bold text-[#6b7280] hover:border-[#fca5a5] transition-all">向上 ↑</button>
                        <button type="button" onclick="selectExpectation('flat')" data-value="flat" class="expectation-btn px-3 py-2 rounded-lg border-2 border-[#e5e7eb] text-xs font-bold text-[#6b7280] hover:border-[#d1d5db] transition-all">震荡 →</button>
                        <button type="button" onclick="selectExpectation('down')" data-value="down" class="expectation-btn px-3 py-2 rounded-lg border-2 border-[#e5e7eb] text-xs font-bold text-[#6b7280] hover:border-[#6ee7b7] transition-all">转弱 ↓</button>
                    </div>
                    <input type="hidden" id="sector-expectation" value="up">
                </div>
                <button type="submit" class="w-full bg-[#6366f1] hover:bg-[#4f46e5] text-white font-semibold py-2.5 rounded-lg transition-all shadow-md shadow-[#6366f1]/20 active:translate-y-0.5 text-sm">保存板块</button>
            </form>
        </div>
    </div>

    <!-- 股票 Modal -->
    <div id="stock-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-[#1f2937]/70 backdrop-blur-sm" onclick="closeStockModal()"></div>
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg relative z-10 overflow-hidden modal-enter border border-[#e5e7eb]">
            <div class="p-4 border-b border-[#e5e7eb] flex justify-between items-center bg-[#f9fafb]">
                <h3 id="stock-modal-title" class="text-base font-bold text-[#111827] flex items-center gap-2">
                    <div class="bg-[#eef2ff] p-1.5 rounded-lg text-[#6366f1]"><i data-lucide="plus" class="w-4 h-4"></i></div>
                    添加标的
                </h3>
                <button onclick="closeStockModal()" class="text-[#9ca3af] hover:text-[#4b5563] hover:bg-[#e5e7eb] p-1.5 rounded-full transition-colors">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <form onsubmit="handleSaveStock(event)" class="p-5 space-y-4">
                <input type="hidden" id="stock-edit-id" value="">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider mb-1">所属板块</label>
                        <select id="stock-sector" class="w-full px-3 py-2 border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6366f1] text-sm font-medium bg-white"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider mb-2">角色定位</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" onclick="selectRole('leader')" data-value="leader" class="role-btn px-2 py-2 rounded-lg border-2 border-[#e5e7eb] text-xs font-bold text-[#6b7280] transition-all">龙头</button>
                            <button type="button" onclick="selectRole('elastic')" data-value="elastic" class="role-btn px-2 py-2 rounded-lg border-2 border-[#e5e7eb] text-xs font-bold text-[#6b7280] transition-all">弹性</button>
                        </div>
                        <input type="hidden" id="stock-role" value="leader">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider mb-2">市场</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="selectMarket('a')" data-value="a" class="market-btn px-3 py-2 rounded-lg border-2 border-[#e5e7eb] text-xs font-bold text-[#6b7280] transition-all">A 股</button>
                        <button type="button" onclick="selectMarket('hk')" data-value="hk" class="market-btn px-3 py-2 rounded-lg border-2 border-[#e5e7eb] text-xs font-bold text-[#6b7280] transition-all">港股</button>
                    </div>
                    <input type="hidden" id="stock-market" value="a">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider mb-1">名称或代码 <span class="text-[#ef4444]">*</span></label>
                        <input type="text" id="stock-keyword" placeholder="中际旭创 / 300308" class="w-full px-3 py-2 border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6366f1] text-sm font-medium">
                    </div>
                    <div class="flex items-end">
                        <button type="button" onclick="handleStockQuery()" class="w-full flex items-center justify-center gap-1.5 text-xs text-[#6366f1] hover:text-[#4f46e5] font-semibold py-2.5 border border-[#c7d2fe] hover:bg-[#eef2ff] rounded-lg transition-all">
                            <i data-lucide="search" class="w-3.5 h-3.5"></i>自动查询填充
                        </button>
                    </div>
                </div>
                <div id="stock-query-result" class="hidden bg-[#eef2ff] border border-[#c7d2fe] rounded-lg px-3 py-2 text-xs text-[#3730a3] font-medium"></div>
                <input type="hidden" id="stock-name" value="">
                <input type="hidden" id="stock-code" value="">
                <input type="hidden" id="stock-ishk" value="false">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider mb-1">持仓股数</label>
                        <input type="number" id="stock-count" min="0" step="1" value="0" class="w-full px-3 py-2 border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6366f1] text-sm font-mono font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider mb-1">成本价（仅供 AI 计算涨幅，页面不展示）</label>
                        <input type="number" id="stock-cost" min="0" step="0.001" placeholder="0" class="w-full px-3 py-2 border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6366f1] text-sm font-mono font-medium">
                    </div>
                </div>
                <button type="submit" class="w-full bg-[#6366f1] hover:bg-[#4f46e5] text-white font-semibold py-2.5 rounded-lg transition-all shadow-md shadow-[#6366f1]/20 active:translate-y-0.5 text-sm">保存标的</button>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-[#111827] text-white text-sm font-medium px-5 py-3 rounded-xl shadow-2xl"></div>

    <script>
        // ---------- 常量与状态 ----------
        const EXPECTATION_META = {
            up:   { label: '景气向上', cls: 'bg-[#fef2f2] text-[#dc2626] border-[#fecaca]' },
            flat: { label: '震荡持平', cls: 'bg-[#f3f4f6] text-[#4b5563] border-[#e5e7eb]' },
            down: { label: '景气转弱', cls: 'bg-[#ecfdf5] text-[#059669] border-[#a7f3d0]' },
        };
        const ROLE_META = {
            leader:  { label: '龙头', cls: 'bg-[#eef2ff] text-[#4338ca]' },
            elastic: { label: '弹性', cls: 'bg-[#fce7f3] text-[#be185d]' },
        };

        let doc = null;              // 服务端完整数据文档
        let priceMap = {};           // code(大写) -> {price, isHK}
        let historyOpen = false;

        // ---------- 数据读写 ----------
        async function loadDoc() {
            const res = await fetch('/api/boom/data');
            const json = await res.json();
            if (!json.success) { showToast('加载数据失败: ' + json.error); return; }
            doc = json.data || {};
            doc.settings = doc.settings || { cash: 0, cnyToHkdRate: 1.1179, maxSectorPct: 40, notes: '' };
            doc.sectors = doc.sectors || [];
            doc.stocks = doc.stocks || [];
            doc.advices = doc.advices || [];
        }

        async function saveDoc() {
            const res = await fetch('/api/boom/data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(doc),
            });
            const json = await res.json();
            if (!json.success) showToast('保存失败: ' + json.error);
            return json.success;
        }

        // ---------- 价格刷新 ----------
        async function refreshPrices() {
            if (!doc || doc.stocks.length === 0) { renderAll(); return; }
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('animate-spin');
            try {
                const res = await fetch('/api/stock/batch-prices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stocks: doc.stocks.map(s => ({ code: s.code, isHK: !!s.isHK })) }),
                });
                const json = await res.json();
                if (json.success && Array.isArray(json.data)) {
                    const now = new Date().toISOString();
                    json.data.forEach(r => {
                        if (r.price > 0) priceMap[r.code.toUpperCase()] = r.price;
                        const stock = doc.stocks.find(s => s.code.toUpperCase() === r.code.toUpperCase());
                        if (stock && r.price > 0) {
                            stock.lastPrice = r.price;
                            stock.lastPriceAt = now;
                            if (r.pe !== undefined) stock.pe = r.pe;
                            if (r.netprofitYoyRatio !== undefined) stock.netprofitYoyRatio = r.netprofitYoyRatio;
                            if (r.predictNetprofitRatio !== undefined) stock.predictNetprofitRatio = r.predictNetprofitRatio;
                        }
                    });
                    await saveDoc(); // 让 skill 也能看到最新价格快照
                }
            } catch (e) {
                showToast('价格刷新失败');
            }
            icon.classList.remove('animate-spin');
            renderAll();
        }

        function getPrice(stock) {
            return priceMap[stock.code.toUpperCase()] || stock.lastPrice || 0;
        }

        // 持仓市值（统一折算为人民币）
        function stockValue(stock) {
            const p = getPrice(stock);
            if (!p || !stock.count) return 0;
            const v = p * stock.count;
            if (stock.isHK) {
                const rate = (doc.settings.cnyToHkdRate && doc.settings.cnyToHkdRate > 0) ? doc.settings.cnyToHkdRate : 1.1179;
                return v / rate;
            }
            return v;
        }

        // ---------- 计算 ----------
        function computeTotals() {
            const holdingValue = doc.stocks.reduce((acc, s) => acc + stockValue(s), 0);
            const cash = Number(doc.settings.cash) || 0;
            const totalAsset = holdingValue + cash;
            const positionPct = totalAsset > 0 ? holdingValue / totalAsset * 100 : 0;
            const sectorValues = {};
            doc.stocks.forEach(s => {
                sectorValues[s.sectorId] = (sectorValues[s.sectorId] || 0) + stockValue(s);
            });
            return { holdingValue, cash, totalAsset, positionPct, sectorValues };
        }

        function fmtMoney(v) {
            if (Math.abs(v) >= 10000) return '¥' + (v / 10000).toFixed(2) + '万';
            return '¥' + v.toFixed(2);
        }

        // ---------- 渲染 ----------
        function renderAll() {
            renderAdvices();
            renderSectors();
            renderSidebar();
            renderSettings();
            lucide.createIcons();
        }

                    ${sec.thesis ? `<p class="px-5 pt-3 text-xs text-[#6b7280] leading-relaxed"><span class="font-bold text-[#4b5563]">景气逻辑：</span>${escapeHtml(sec.thesis)}</p>` : ''}
                    <div class="overflow-x-auto mt-2">

                                    <th class="px-4 py-2">标的</th>

        function renderSidebar() {
            const totals = computeTotals();
            document.getElementById('current-position-pct').textContent = totals.positionPct.toFixed(1) + '%';
            document.getElementById('total-asset-display').textContent = fmtMoney(totals.totalAsset);
            document.getElementById('position-bar').style.width = Math.min(totals.positionPct, 100) + '%';

            const summary = doc.summary;
            const targetEl = document.getElementById('target-position-pct');
            const marker = document.getElementById('target-marker');
            if (summary && summary.targetPositionPct !== undefined && summary.targetPositionPct !== null) {
                targetEl.textContent = Number(summary.targetPositionPct).toFixed(0) + '%';
                marker.style.left = Math.min(Number(summary.targetPositionPct), 100) + '%';
                marker.classList.remove('hidden');
            } else {
                targetEl.textContent = '--%';
                marker.classList.add('hidden');
            }

            const tempEl = document.getElementById('market-temp-display');
            if (summary && summary.marketTemp !== undefined && summary.marketTemp !== null) {
                const t = Number(summary.marketTemp);
                const color = t >= 70 ? '#f87171' : (t >= 45 ? '#fbbf24' : '#34d399');
                tempEl.innerHTML = `<span style="color:${color}">${t}</span> <span class="text-[10px] text-[#9ca3af]">${escapeHtml(summary.sentiment || '')}</span>`;
            } else {
                tempEl.textContent = '--';
            }

            // 板块分布
            const dist = document.getElementById('sector-distribution');
            if (doc.sectors.length === 0) {
                dist.innerHTML = '<p class="text-xs text-[#9ca3af]">暂无板块</p>';
            } else {
                const targetMap = {};
                if (summary && Array.isArray(summary.sectorTargets)) {
                    summary.sectorTargets.forEach(t => { targetMap[t.sectorId] = t; });
                }
                const sortedForDist = [...doc.sectors].sort((a, b) => (totals.sectorValues[b.id] || 0) - (totals.sectorValues[a.id] || 0));
                dist.innerHTML = sortedForDist.map(sec => {
                    const cur = totals.totalAsset > 0 ? ((totals.sectorValues[sec.id] || 0) / totals.totalAsset * 100) : 0;
                    const tgt = targetMap[sec.id];
                    const tgtPct = tgt ? Number(tgt.targetPct) : null;
                    return `
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xs font-bold text-[#374151]">${escapeHtml(sec.name)}</span>
                            <span class="text-[10px] font-mono text-[#6b7280]">${cur.toFixed(1)}%${tgtPct !== null ? ' → <span class="text-[#6366f1] font-bold">' + tgtPct.toFixed(0) + '%</span>' : ''}</span>
                        </div>
                        <div class="relative h-2 bg-[#f3f4f6] rounded-full">
                            <div class="absolute left-0 top-0 h-2 bg-[#a5b4fc] rounded-full" style="width:${Math.min(cur, 100)}%"></div>
                            ${tgtPct !== null ? `<div class="absolute -top-0.5 h-3 w-0.5 bg-[#f59e0b]" style="left:${Math.min(tgtPct, 100)}%"></div>` : ''}
                        </div>
                        ${tgt && tgt.comment ? `<p class="text-[10px] text-[#9ca3af] mt-1 leading-snug">${escapeHtml(tgt.comment)}</p>` : ''}
                    </div>`;
                }).join('');
            }

            // AI 总结
            const summaryEl = document.getElementById('ai-summary');
            const summaryTimeEl = document.getElementById('ai-summary-time');
            if (summary && summary.text) {
                summaryEl.textContent = summary.text;
                summaryTimeEl.textContent = summary.generatedAt ? '生成于 ' + formatTime(summary.generatedAt) : '';
            } else {
                summaryEl.textContent = '暂无总结，运行 /boom-advisor 生成。';
                summaryTimeEl.textContent = '';
            }

            // 历史建议
            const history = doc.advices.filter(a => a.status !== 'pending').slice().reverse().slice(0, 30);
            document.getElementById('history-list').innerHTML = history.length === 0
                ? '<p class="text-xs text-[#9ca3af]">暂无历史</p>'
                : history.map(a => {
                    const isBuy = a.action === 'buy';
                    const statusLabel = a.status === 'done' ? '<span class="text-[#059669] font-bold">已执行</span>' : '<span class="text-[#9ca3af]">已忽略</span>';
                    return `<div class="flex items-center justify-between text-xs py-1.5 border-b border-[#f9fafb]">
                        <span class="font-medium text-[#4b5563]"><span class="${isBuy ? 'text-[#dc2626]' : 'text-[#059669]'} font-bold">${isBuy ? '买' : '卖'}</span> ${escapeHtml(a.name)} ${a.shares}股</span>
                        <span class="text-[10px]">${statusLabel}</span>
                    </div>`;
                }).join('');
        }

        function renderSettings() {
            document.getElementById('setting-cash').value = doc.settings.cash || 0;
            document.getElementById('setting-max-sector').value = doc.settings.maxSectorPct || 40;
            document.getElementById('setting-notes').value = doc.settings.notes || '';
        }

        // ---------- 交易指引操作 ----------
        async function executeAdvice(id) {
            const advice = doc.advices.find(a => a.id === id);
            if (!advice) return;
            const stock = doc.stocks.find(s => s.code.toUpperCase() === advice.code.toUpperCase());
            const delta = advice.action === 'buy' ? advice.shares : -advice.shares;
            if (stock) {
                stock.count = Math.max(0, (stock.count || 0) + delta);
            }
            // 现金同步变动（按参考价估算）
            if (advice.price > 0) {
                const cashDelta = advice.price * advice.shares * (advice.action === 'buy' ? -1 : 1);
                doc.settings.cash = Math.max(0, (Number(doc.settings.cash) || 0) + cashDelta);
            }
            advice.status = 'done';
            advice.closedAt = new Date().toISOString();
            await saveDoc();
            renderAll();
            showToast((advice.action === 'buy' ? '已买入 ' : '已卖出 ') + advice.name + ' ' + advice.shares + ' 股，持仓与现金已更新');
        }

        async function dismissAdvice(id) {
            const advice = doc.advices.find(a => a.id === id);
            if (!advice) return;
            advice.status = 'dismissed';
            advice.closedAt = new Date().toISOString();
            await saveDoc();
            renderAll();
        }

        // ---------- 板块操作 ----------
        function openSectorModal(id) {
            const modal = document.getElementById('sector-modal');
            document.getElementById('sector-edit-id').value = id || '';
            const sec = id ? doc.sectors.find(s => s.id === id) : null;
            document.getElementById('sector-modal-title').lastChild.textContent = sec ? ' 编辑板块' : ' 新增板块';
            document.getElementById('sector-name').value = sec ? sec.name : '';
            document.getElementById('sector-thesis').value = sec ? (sec.thesis || '') : '';
            selectExpectation(sec ? (sec.expectation || 'up') : 'up');
            modal.classList.remove('hidden');
            lucide.createIcons();
        }
        function closeSectorModal() { document.getElementById('sector-modal').classList.add('hidden'); }

        function selectExpectation(v) {
            document.getElementById('sector-expectation').value = v;
            document.querySelectorAll('.expectation-btn').forEach(btn => {
                const active = btn.dataset.value === v;
                btn.classList.toggle('border-[#6366f1]', active);
                btn.classList.toggle('bg-[#eef2ff]', active);
                btn.classList.toggle('text-[#4338ca]', active);
            });
        }

        async function handleSaveSector(e) {
            e.preventDefault();
            const id = document.getElementById('sector-edit-id').value;
            const name = document.getElementById('sector-name').value.trim();
            if (!name) return;
            const thesis = document.getElementById('sector-thesis').value.trim();
            const expectation = document.getElementById('sector-expectation').value;
            if (id) {
                const sec = doc.sectors.find(s => s.id === id);
                if (sec) Object.assign(sec, { name, thesis, expectation });
            } else {
                doc.sectors.push({ id: genId('s'), name, thesis, expectation });
            }
            await saveDoc();
            closeSectorModal();
            renderAll();
        }

        async function cycleExpectation(id) {
            const sec = doc.sectors.find(s => s.id === id);
            if (!sec) return;
            const order = ['up', 'flat', 'down'];
            sec.expectation = order[(order.indexOf(sec.expectation || 'up') + 1) % order.length];
            await saveDoc();
            renderAll();
        }

        async function deleteSector(id) {
            const sec = doc.sectors.find(s => s.id === id);
            if (!sec) return;
            const count = doc.stocks.filter(s => s.sectorId === id).length;
            if (!confirm(`删除板块「${sec.name}」及其 ${count} 只标的？`)) return;
            doc.sectors = doc.sectors.filter(s => s.id !== id);
            doc.stocks = doc.stocks.filter(s => s.sectorId !== id);
            await saveDoc();
            renderAll();
        }

        // ---------- 股票操作 ----------
        function openStockModal(sectorId, stockId) {
            const modal = document.getElementById('stock-modal');
            const select = document.getElementById('stock-sector');
            select.innerHTML = doc.sectors.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
            const stock = stockId ? doc.stocks.find(s => s.id === stockId) : null;
            document.getElementById('stock-edit-id').value = stockId || '';
            document.getElementById('stock-modal-title').lastChild.textContent = stock ? ' 编辑标的' : ' 添加标的';
            select.value = stock ? stock.sectorId : sectorId;
            selectRole(stock ? (stock.role || 'leader') : 'leader');
            selectMarket(stock ? (stock.isHK ? 'hk' : 'a') : 'a');
            document.getElementById('stock-keyword').value = stock ? stock.name : '';
            document.getElementById('stock-name').value = stock ? stock.name : '';
            document.getElementById('stock-code').value = stock ? stock.code : '';
            document.getElementById('stock-ishk').value = stock ? String(!!stock.isHK) : 'false';
            document.getElementById('stock-count').value = stock ? (stock.count || 0) : 0;
            document.getElementById('stock-cost').value = stock && stock.costPrice ? stock.costPrice : '';
            const resultEl = document.getElementById('stock-query-result');
            if (stock) {
                resultEl.textContent = `已选：${stock.name} (${stock.code})`;
                resultEl.classList.remove('hidden');

        function closeStockModal() { document.getElementById('stock-modal').classList.add('hidden'); }

        function selectRole(v) {
            document.getElementById('stock-role').value = v;
            document.querySelectorAll('.role-btn').forEach(btn => {
                const active = btn.dataset.value === v;
                btn.classList.toggle('border-[#6366f1]', active);
                btn.classList.toggle('bg-[#eef2ff]', active);
                btn.classList.toggle('text-[#4338ca]', active);
            });
        }
        function selectMarket(v) {
            document.getElementById('stock-market').value = v;
            document.querySelectorAll('.market-btn').forEach(btn => {
                const active = btn.dataset.value === v;
                btn.classList.toggle('border-[#6366f1]', active);
                btn.classList.toggle('bg-[#eef2ff]', active);
                btn.classList.toggle('text-[#4338ca]', active);
            });
        }

        async function handleStockQuery() {
            const keyword = document.getElementById('stock-keyword').value.trim();
            if (!keyword) { showToast('请输入股票名称或代码'); return; }
            const market = document.getElementById('stock-market').value;
            const resultEl = document.getElementById('stock-query-result');
            resultEl.textContent = '查询中…';
            resultEl.classList.remove('hidden');
            try {
                const res = await fetch(`/api/stock/query?keyword=${encodeURIComponent(keyword)}&market=${market}`);
                const json = await res.json();
                if (!json.success) { resultEl.textContent = '查询失败：' + json.error; return; }
                const d = json.data;
                document.getElementById('stock-name').value = d.name;
                document.getElementById('stock-code').value = d.code;
                document.getElementById('stock-ishk').value = String(!!d.isHK);
                resultEl.textContent = `已匹配：${d.name} (${d.code}) 现价 ${d.price}`;
            } catch (e) {
                resultEl.textContent = '查询异常，请重试';
            }
        }

        async function handleSaveStock(e) {
            e.preventDefault();
            const name = document.getElementById('stock-name').value.trim();
            const code = document.getElementById('stock-code').value.trim();
            if (!name || !code) { showToast('请先点击「自动查询填充」匹配股票'); return; }
            const id = document.getElementById('stock-edit-id').value;
            const data = {
                sectorId: document.getElementById('stock-sector').value,
                role: document.getElementById('stock-role').value,
                name, code,
                isHK: document.getElementById('stock-ishk').value === 'true',
                count: parseInt(document.getElementById('stock-count').value) || 0,
                costPrice: parseFloat(document.getElementById('stock-cost').value) || 0,
            };
            if (id) {
                const stock = doc.stocks.find(s => s.id === id);
                if (stock) Object.assign(stock, data);
            } else {
                if (doc.stocks.some(s => s.code.toUpperCase() === code.toUpperCase())) {
                    showToast('该标的已在股票池中');
                    return;
                }
                doc.stocks.push({ id: genId('st'), ...data });
            }
            await saveDoc();
            closeStockModal();
            refreshPrices();
        }

        async function deleteStock(id) {
            const stock = doc.stocks.find(s => s.id === id);
            if (!stock) return;
            if (!confirm(`删除标的「${stock.name}」？`)) return;
            doc.stocks = doc.stocks.filter(s => s.id !== id);
            await saveDoc();
            renderAll();
        }

        // ---------- 设置 ----------
        async function saveSettings() {
            doc.settings.cash = parseFloat(document.getElementById('setting-cash').value) || 0;
            doc.settings.maxSectorPct = parseFloat(document.getElementById('setting-max-sector').value) || 40;
            doc.settings.notes = document.getElementById('setting-notes').value.trim();
            if (await saveDoc()) showToast('设置已保存');
            renderAll();
        }

        // ---------- 工具 ----------
        function toggleHistory() {
            historyOpen = !historyOpen;
            document.getElementById('history-list').classList.toggle('hidden', !historyOpen);
            document.getElementById('history-chevron').style.transform = historyOpen ? 'rotate(180deg)' : '';
        }

        function genId(prefix) {
            return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function formatTime(iso) {
            try {
                const d = new Date(iso);
                return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            } catch (e) { return iso; }
        }

        let toastTimer = null;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
        }

        // ---------- 启动 ----------
        (async function init() {
            await loadDoc();
            renderAll();
            refreshPrices();
        })();
    </script>
</body>
</html>
