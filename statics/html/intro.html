<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.PageTitle}}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: { extend: {
                colors: { page:'#F4F0E8', cream:'#E0D7C7', card:'#FBF9F5', sand:'#E7A265', terra:'#D0643E', ink:'#3D362A' },
                fontFamily: { display:['Fraunces','serif'], sans:['Inter','system-ui','sans-serif'] },
                boxShadow: { block:'6px 6px 0 #3D362A', blockSm:'4px 4px 0 #3D362A', blockHover:'9px 9px 0 #3D362A' },
            } },
        }
    </script>

    <style>
        body { font-family:'Inter',system-ui,sans-serif; background:#F4F0E8; color:#3D362A; }
        .font-display { font-family:'Fraunces',serif; }

        /* staggered entrance */
        .rise { opacity:0; transform:translateY(22px); animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
        @keyframes rise { to { opacity:1; transform:none; } }

        /* self-drawing underline under the slogan */
        .draw-line { stroke-dasharray:760; stroke-dashoffset:760; animation: draw 1.3s 1s cubic-bezier(.6,.1,.2,1) forwards; }
        @keyframes draw { to { stroke-dashoffset:0; } }

        /* slow drifting backdrop blobs */
        .blob { position:absolute; border-radius:9999px; filter:blur(8px); opacity:.5; animation: drift 14s ease-in-out infinite alternate; }
        @keyframes drift { from { transform:translate(0,0) scale(1) } to { transform:translate(28px,-26px) scale(1.08) } }

        .btn-enter:hover { transform:translate(-3px,-3px); box-shadow:9px 9px 0 #3D362A; }
        .btn-enter { transition: transform .18s ease, box-shadow .18s ease; }

        .grain { background-image: radial-gradient(rgba(61,54,42,.045) 1px, transparent 1px); background-size: 18px 18px; }
    </style>
</head>
<body class="min-h-screen overflow-hidden">

    <!-- decorative backdrop -->
    <div class="fixed inset-0 grain pointer-events-none"></div>
    <div class="blob w-[42vw] h-[42vw] bg-sand/40 -top-[12vw] -left-[8vw]"></div>
    <div class="blob w-[34vw] h-[34vw] bg-terra/25 bottom-[-10vw] right-[-6vw]" style="animation-delay:-6s"></div>

    <main class="relative z-10 min-h-screen flex flex-col">

        <!-- top brand -->
        <header class="px-6 md:px-12 pt-7 flex items-center justify-between rise" style="animation-delay:.05s">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-md bg-terra border-2 border-ink shadow-blockSm flex items-center justify-center">
                    <span class="font-display font-bold text-page text-lg leading-none">P</span>
                </div>
                <div class="font-display font-bold text-xl tracking-tight">PERIPHERA</div>
            </div>
            <a href="/portal" onclick="markSeen()" class="text-sm font-bold text-ink/50 hover:text-terra transition-colors">跳过 Skip →</a>
        </header>

        <!-- hero -->
        <section class="flex-1 flex items-center">
            <div class="max-w-[1100px] mx-auto px-6 md:px-12 py-12 w-full">

                <div class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-[.2em] text-terra mb-7 rise" style="animation-delay:.15s">
                    <span class="w-2 h-2 rounded-full bg-terra"></span> 外围情报一站式 · 每日 AI 简报
                </div>

                <h1 class="font-display font-bold tracking-[-0.02em] leading-[0.98] text-[44px] sm:text-[68px] lg:text-[88px]">
                    <span class="block rise" style="animation-delay:.25s">Invest like a pro,</span>
                    <span class="block relative w-max rise" style="animation-delay:.45s">
                        <span class="text-terra">profit like a pro.</span>
                        <svg class="absolute left-0 -bottom-2 md:-bottom-3 w-full" height="22" viewBox="0 0 760 22" fill="none" preserveAspectRatio="none">
                            <path class="draw-line" d="M4 14 C 160 4, 320 20, 500 10 S 700 6, 756 13" stroke="#E7A265" stroke-width="7" stroke-linecap="round"/>
                        </svg>
                    </span>
                </h1>

                <p class="mt-12 md:mt-14 text-xl md:text-2xl text-ink/80 max-w-2xl leading-relaxed font-medium rise" style="animation-delay:.65s">
                    第一性原理 —— <span class="text-ink font-semibold">看见基金经理每天看见的，<br class="hidden sm:block">就赚到基金经理赚到的。</span>
                </p>

                <blockquote class="mt-8 pl-5 border-l-4 border-terra max-w-2xl text-ink/65 leading-relaxed rise" style="animation-delay:.8s">
                    彼得·林奇：「每个人都有足够的智商在股市里赚钱。普通人凭借身边的常识与观察，完全可以战胜华尔街的专业机构。」
                </blockquote>

                <!-- value props -->
                <div class="mt-10 grid sm:grid-cols-3 gap-4 max-w-3xl rise" style="animation-delay:.95s">
                    <div class="bg-card/70 border-2 border-ink rounded-xl px-4 py-3 shadow-blockSm">
                        <div class="font-display font-bold text-lg">一站式</div>
                        <div class="text-xs font-semibold text-ink/55 mt-0.5">路透·彭博·马斯克·研报·商品·股市</div>
                    </div>
                    <div class="bg-card/70 border-2 border-ink rounded-xl px-4 py-3 shadow-blockSm">
                        <div class="font-display font-bold text-lg">每日 AI 简报</div>
                        <div class="text-xs font-semibold text-ink/55 mt-0.5">五分钟读完外围全局</div>
                    </div>
                    <div class="bg-card/70 border-2 border-ink rounded-xl px-4 py-3 shadow-blockSm">
                        <div class="font-display font-bold text-lg">像专业一样</div>
                        <div class="text-xs font-semibold text-ink/55 mt-0.5">用机构的视角做决策</div>
                    </div>
                </div>

                <div class="mt-11 flex flex-wrap items-center gap-4 rise" style="animation-delay:1.1s">
                    <a href="/portal" onclick="markSeen()"
                       class="btn-enter inline-flex items-center gap-2 bg-ink text-page font-bold text-lg px-8 py-4 rounded-md border-2 border-ink shadow-block">
                        进入情报台 Enter <span aria-hidden="true">→</span>
                    </a>
                    <span class="text-sm font-semibold text-ink/45">本页仅首次展示一次</span>
                </div>
            </div>
        </section>

        <footer class="px-6 md:px-12 pb-6 text-sm font-semibold text-ink/45 rise" style="animation-delay:1.25s">
            PERIPHERA · 模拟数据，仅供产品演示，非投资建议 · {{.Version}}
        </footer>
    </main>

    <script>
        // 标记已看过，之后 /portal 不再自动跳转到本页
        function markSeen() { try { localStorage.setItem('periphera_intro_seen', '1'); } catch (e) {} }
        // 进入本页即视为已展示（保证只自动出现一次）；通过底部链接「重温理念」仍可主动回看
        markSeen();
    </script>
</body>
</html>
