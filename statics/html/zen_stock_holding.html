<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大A超市持仓管理</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* 简单的淡入动画 */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 模态框动画 */
        .modal-enter { animation: modalIn 0.2s ease-out forwards; }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 价格上涨闪烁动画（红色） */
        @keyframes priceUp {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(239, 68, 68, 0.2); }
        }
        .price-up {
            animation: priceUp 0.6s ease-in-out 2;
        }

        /* 价格下跌闪烁动画（绿色） */
        @keyframes priceDown {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(16, 185, 129, 0.2); }
        }
        .price-down {
            animation: priceDown 0.6s ease-in-out 2;
        }

        /* Toggle开关样式 */
        .toggle-switch {
            position: relative;
            cursor: pointer;
        }
        .toggle-dot {
            position: absolute;
            top: 0.125rem;
            left: 0.125rem;
            width: 1.25rem;
            height: 1.25rem;
            background-color: white;
            border-radius: 9999px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease-in-out;
        }
        #auto-refresh-toggle:checked ~ .toggle-switch .toggle-dot {
            transform: translateX(1.25rem);
        }

        /* 市场选择radio按钮样式 */
        .market-radio input[type="radio"]:checked + .market-radio-label {
            border-color: #6366f1 !important;
            background-color: #eef2ff !important;
            color: #6366f1 !important;
        }
        .market-radio input[type="radio"]:checked + .market-radio-label i {
            color: #6366f1 !important;
        }
        .market-radio-label {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-[#f9fafb] text-[#111827] min-h-screen selection:bg-[#6366f1]/20 selection:text-[#3730a3]">

    <div class="max-w-[1800px] mx-auto p-4 md:p-8">
        
        <!-- Header -->
        <header class="mb-8 flex flex-col items-center">
            <!-- <div class="flex items-center gap-3 mb-2">
                <div class="bg-gradient-to-br from-[#6366f1] to-[#4f46e5] p-2.5 rounded-xl shadow-lg shadow-[#6366f1]/30">
                    <i data-lucide="activity" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-[#111827] tracking-tight">持仓管理</h1>
            </div>
            <p class="text-[#6b7280] font-medium text-sm mb-6">慢慢变富</p> -->

            <!-- 随机格言 -->
            <div class="max-w-2xl mx-auto bg-white border border-[#e5e7eb] rounded-full px-6 py-2.5 flex items-center justify-center gap-3 shadow-sm hover:shadow-md transition-shadow">
                <i data-lucide="quote" class="w-4 h-4 text-[#6366f1] fill-current opacity-70"></i>
                <p class="text-sm text-[#4b5563] italic" id="quote-text">
                    <!-- 格言将通过JS插入 -->
                </p>
            </div>
        </header>

        <!-- 左右分栏布局 -->
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
            
            <!-- 左侧：持仓列表 (占4/5宽度，80%) -->
            <div class="lg:col-span-4">
                <!-- 持仓明细区域：左右分栏 -->
                <div class="grid grid-cols-1 md:grid-cols-10 gap-6">
                    
                    <!-- 投资要点 Tips (左侧，占3/10，30%) -->
                    <div class="md:col-span-3">
                        <div id="investment-tips" class="bg-white rounded-2xl shadow-sm border border-[#e5e7eb] overflow-hidden sticky top-4">
                            <!-- Tips内容将通过JS插入 -->
                        </div>
                    </div>

                    <!-- 表格区域 (右侧，占7/10，70%) -->
                    <div class="md:col-span-7">
                        <div class="bg-white rounded-2xl shadow-sm border border-[#e5e7eb] overflow-hidden">
                            <div class="p-6 border-b border-[#e5e7eb] flex flex-col md:flex-row justify-between items-center gap-4 bg-[#ffffff]">
                                <div class="flex items-center gap-4">
                                    <h3 class="text-lg font-bold text-[#111827] flex items-center gap-2">
                                        <span class="w-1 h-6 bg-[#6366f1] rounded-full"></span>
                                        持仓明细
                                    </h3>
                                    <div class="flex bg-[#f3f4f6] p-1 rounded-lg" id="filter-container">
                                        <!-- 筛选按钮 -->
                                        <button onclick="setFilter('all')" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 bg-white text-[#6366f1] shadow-sm" data-filter="all">全部</button>
                                        <button onclick="setFilter('trend')" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 text-[#6b7280] hover:text-[#111827]" data-filter="trend">进攻</button>
                                        <button onclick="setFilter('core')" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 text-[#6b7280] hover:text-[#111827]" data-filter="core">核心</button>
                                        <button onclick="setFilter('reverse')" class="filter-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 text-[#6b7280] hover:text-[#111827]" data-filter="reverse">逆向</button>
                                    </div>
                                    
                                    <!-- 自动刷新开关 -->
                                    <div class="flex items-center gap-2">
                                        <label class="flex items-center gap-2 cursor-pointer" for="auto-refresh-toggle">
                                            <span class="text-xs text-[#6b7280] font-medium">自动刷新</span>
                                            <div class="relative inline-block w-11 h-6">
                                                <input type="checkbox" id="auto-refresh-toggle" class="sr-only peer">
                                                <div class="toggle-switch w-11 h-6 bg-[#d1d5db] rounded-full transition-colors duration-200 peer-checked:bg-[#6366f1]">
                                                    <div class="toggle-dot"></div>
                                                </div>
                                            </div>
                                        </label>
                                    </div>
                                    
                                    <!-- 刷新状态指示器 -->
                                    <div class="flex items-center gap-2 text-xs text-[#9ca3af]" id="refresh-indicator">
                                        <i data-lucide="activity" class="w-3.5 h-3.5"></i>
                                        <span>实时刷新</span>
                                    </div>
                                </div>

                                <div class="flex items-center gap-2">
                                    <button onclick="refreshStockPrices()" class="flex items-center gap-2 bg-white hover:bg-[#f9fafb] text-[#6b7280] hover:text-[#6366f1] px-4 py-2.5 rounded-lg font-medium transition-all border border-[#e5e7eb] hover:border-[#6366f1]" title="手动刷新股价">
                                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                                        <span>刷新</span>
                                    </button>
                                    <button onclick="exportToJSON()" class="flex items-center gap-2 bg-white hover:bg-[#f9fafb] text-[#6b7280] hover:text-[#6366f1] px-4 py-2.5 rounded-lg font-medium transition-all border border-[#e5e7eb] hover:border-[#6366f1]" title="导出数据为JSON">
                                        <i data-lucide="download" class="w-4 h-4"></i>
                                        <span>导出</span>
                                    </button>
                                    <button onclick="toggleModal(true)" class="flex items-center gap-2 bg-[#6366f1] hover:bg-[#4f46e5] text-white px-5 py-2.5 rounded-lg font-medium transition-all shadow-lg shadow-[#6366f1]/20 hover:shadow-[#6366f1]/40 active:translate-y-0.5">
                                        <i data-lucide="plus" class="w-4 h-4"></i>
                                        <span>录入新持仓</span>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="overflow-x-auto">
                                <table class="w-full">
                                    <thead>
                                        <tr class="bg-[#f9fafb] text-left text-xs font-semibold text-[#6b7280] uppercase tracking-wider select-none border-b border-[#e5e7eb]">
                                            <th class="px-4 py-4 cursor-pointer hover:bg-[#f3f4f6] transition-colors group" onclick="handleSort('strategy')">
                                                <div class="flex items-center gap-1.5">
                                                    策略
                                                    <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-[#9ca3af] opacity-40 group-hover:opacity-100" id="sort-icon-strategy"></i>
                                                </div>
                                            </th>
                                            <th class="px-4 py-4">股票名称</th>
                                            <th class="px-4 py-4 cursor-pointer hover:bg-[#f3f4f6] transition-colors group text-right" onclick="handleSort('marketValue')">
                                                <div class="flex items-center justify-end gap-1.5">
                                                    <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-[#9ca3af] opacity-40 group-hover:opacity-100" id="sort-icon-marketValue"></i>
                                                    市值
                                                </div>
                                            </th>
                                            <th class="px-4 py-4 text-right">价格/股数</th>
                                            <th class="px-4 py-4 text-center w-20">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="stock-table-body" class="divide-y divide-[#e5e7eb]">
                                        <!-- 表格内容将通过JS插入 -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：统计信息 (占1/5宽度，20%) -->
            <div class="lg:col-span-1 space-y-6">
                
                <!-- 总资产卡片 -->
                <div class="bg-gradient-to-br from-[#1f2937] to-[#111827] text-white rounded-2xl p-6 shadow-xl shadow-[#111827]/20 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-40 h-40 bg-[#6366f1]/10 rounded-full -translate-y-1/2 translate-x-1/3 blur-3xl"></div>
                    
                    <div class="relative z-10">
                        <div class="flex items-center gap-3 mb-4">
                            <div class="p-3 bg-white/5 backdrop-blur-sm rounded-xl border border-white/10">
                                <i data-lucide="pie-chart" class="w-6 h-6 text-[#818cf8]"></i>
                            </div>
                            <div>
                                <p class="text-[#9ca3af] text-xs font-bold uppercase tracking-wider">总资产</p>
                            </div>
                        </div>
                        
                        <div class="mb-6">
                            <p class="text-3xl font-bold tracking-tight text-white mb-1" id="total-asset-display">¥0.00</p>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-[#10b981]/20 text-[#34d399]">+0.00%</span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4 pt-4 border-t border-white/10">
                            <div>
                                <p class="text-[#9ca3af] text-xs uppercase tracking-wider mb-1 font-bold">持仓数量</p>
                                <p class="text-xl font-bold text-white" id="total-count-display">0</p>
                            </div>
                            <div>
                                <p class="text-[#9ca3af] text-xs uppercase tracking-wider mb-1 font-bold">当前视图</p>
                                <p class="text-xl font-bold text-[#818cf8]" id="view-count-display">0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 策略仪表盘 -->
                <div id="strategy-dashboard" class="space-y-4">
                    <!-- 仪表盘卡片将通过JS插入 -->
                </div>

                <!-- 汇率信息卡片 -->
                <div class="bg-white rounded-xl p-5 shadow-sm border border-[#e5e7eb]">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="p-2 rounded-lg bg-[#fef3c7] text-[#92400e]">
                            <i data-lucide="dollar-sign" class="w-4 h-4"></i>
                        </div>
                        <h4 class="font-bold text-[#111827] text-sm">汇率信息</h4>
                    </div>
                    <div class="space-y-2 text-xs">
                        <div class="flex items-center justify-between">
                            <span class="text-[#6b7280]">人民币 → 港币</span>
                            <span class="font-bold text-[#111827] font-mono">1 : <span id="cny-to-hkd-rate">1.1179</span></span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-[#6b7280]">港币 → 人民币</span>
                            <span class="font-bold text-[#111827] font-mono">1 : <span id="hkd-to-cny-rate">0.8946</span></span>
                        </div>
                        <div class="pt-2 border-t border-[#f3f4f6] text-[#9ca3af] text-[10px]">
                            当前使用汇率
                        </div>
                    </div>
                </div>

                <!-- 标签统计 -->
                <div id="tags-statistics" class="bg-white rounded-2xl shadow-sm border border-[#e5e7eb] overflow-hidden">
                    <div class="p-5 border-b border-[#e5e7eb] bg-[#f9fafb]">
                        <div class="flex items-center gap-2">
                            <div class="p-2 rounded-lg bg-[#eef2ff] text-[#6366f1]">
                                <i data-lucide="tags" class="w-4 h-4"></i>
                            </div>
                            <h3 class="font-bold text-[#111827] text-sm">标签统计</h3>
                        </div>
                    </div>
                    <div id="tags-statistics-content" class="p-5">
                        <!-- 标签统计内容将通过JS插入 -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal 弹窗 -->
    <div id="add-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-[#1f2937]/70 backdrop-blur-sm transition-opacity" onclick="toggleModal(false)"></div>
        
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg relative z-10 overflow-hidden modal-enter border border-[#e5e7eb]">
            <div class="p-6 border-b border-[#e5e7eb] flex justify-between items-center bg-[#f9fafb]">
                <h3 id="modal-title" class="text-lg font-bold text-[#111827] flex items-center gap-2">
                    <div class="bg-[#eef2ff] p-2 rounded-lg text-[#6366f1]">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </div>
                    录入新持仓
                </h3>
                <button onclick="toggleModal(false)" class="text-[#9ca3af] hover:text-[#4b5563] hover:bg-[#e5e7eb] p-2 rounded-full transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="p-8">
                <form id="add-stock-form" onsubmit="handleAddStock(event)" class="space-y-6">
                    <input type="hidden" id="edit-stock-id" value="">
                    <input type="hidden" id="form-isHK" value="false">
                    <div>
                        <label class="block text-sm font-semibold text-[#374151] mb-3">选择策略归属</label>
                        <div class="grid grid-cols-3 gap-3" id="strategy-selector">
                            <!-- 策略按钮通过JS动态增强 -->
                            <button type="button" onclick="selectStrategy('trend')" class="strategy-btn relative flex flex-col items-center gap-2 py-4 px-2 rounded-xl border transition-all text-sm bg-white border-[#e5e7eb] text-[#6b7280] hover:bg-[#f9fafb]" data-value="trend">
                                <span class="font-bold">趋势</span>
                                <span class="text-[10px] opacity-70">进攻</span>
                            </button>
                            <button type="button" onclick="selectStrategy('core')" class="strategy-btn relative flex flex-col items-center gap-2 py-4 px-2 rounded-xl border transition-all text-sm bg-white border-[#e5e7eb] text-[#6b7280] hover:bg-[#f9fafb]" data-value="core">
                                <span class="font-bold">核心</span>
                                <span class="text-[10px] opacity-70">压舱</span>
                            </button>
                            <button type="button" onclick="selectStrategy('reverse')" class="strategy-btn relative flex flex-col items-center gap-2 py-4 px-2 rounded-xl border transition-all text-sm bg-white border-[#e5e7eb] text-[#6b7280] hover:bg-[#f9fafb]" data-value="reverse">
                                <span class="font-bold">逆向</span>
                                <span class="text-[10px] opacity-70">反转</span>
                            </button>
                        </div>
                        <input type="hidden" id="form-strategy" value="trend">
                    </div>

                    <div class="space-y-3">
                        <div class="bg-[#eff6ff] border border-[#bfdbfe] rounded-lg p-3 flex items-start gap-2">
                            <i data-lucide="info" class="w-4 h-4 text-[#3b82f6] mt-0.5 flex-shrink-0"></i>
                            <p class="text-xs text-[#1e40af] leading-relaxed">
                                <strong>智能填充：</strong>输入股票名称或代码后，点击下方按钮自动查询完整信息。提交时如价格未填写，系统会自动获取最新价格。
                            </p>
                        </div>
                        
                        <!-- 市场选择 -->
                        <div>
                            <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider mb-2">选择市场 <span class="text-[#9ca3af] font-normal normal-case">(解决同名股票问题)</span></label>
                            <div class="flex gap-3">
                                <label class="market-radio flex-1 cursor-pointer">
                                    <input type="radio" name="market" value="a" id="market-a" class="sr-only" checked onchange="handleMarketChange('a')">
                                    <div class="market-radio-label px-4 py-3 rounded-lg border-2 border-[#e5e7eb] bg-white text-center hover:border-[#d1d5db]">
                                        <div class="flex items-center justify-center gap-2">
                                            <i data-lucide="trending-up" class="w-4 h-4 text-[#6b7280]"></i>
                                            <span class="text-sm font-semibold text-[#111827]">A股</span>
                                        </div>
                                    </div>
                                </label>
                                <label class="market-radio flex-1 cursor-pointer">
                                    <input type="radio" name="market" value="hk" id="market-hk" class="sr-only" onchange="handleMarketChange('hk')">
                                    <div class="market-radio-label px-4 py-3 rounded-lg border-2 border-[#e5e7eb] bg-white text-center hover:border-[#d1d5db]">
                                        <div class="flex items-center justify-center gap-2">
                                            <i data-lucide="globe" class="w-4 h-4 text-[#6b7280]"></i>
                                            <span class="text-sm font-semibold text-[#111827]">港股</span>
                                        </div>
                                    </div>
                                </label>
                                <label class="market-radio flex-1 cursor-pointer">
                                    <input type="radio" name="market" value="" id="market-all" class="sr-only" onchange="handleMarketChange('')">
                                    <div class="market-radio-label px-4 py-3 rounded-lg border-2 border-[#e5e7eb] bg-white text-center hover:border-[#d1d5db]">
                                        <div class="flex items-center justify-center gap-2">
                                            <i data-lucide="search" class="w-4 h-4 text-[#6b7280]"></i>
                                            <span class="text-sm font-semibold text-[#111827]">全部</span>
                                        </div>
                                    </div>
                                </label>
                            </div>
                            <input type="hidden" id="form-market" value="a">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-5">
                            <div class="space-y-1.5">
                                <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider">股票名称 <span class="text-[#ef4444]">*</span></label>
                                <input type="text" id="form-name" placeholder="如：中际旭创" class="w-full px-4 py-3 bg-white border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6366f1] transition-all font-medium text-[#111827]">
                            </div>
                            <div class="space-y-1.5">
                                <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider">代码 <span class="text-[#9ca3af] font-normal">(或名称)</span></label>
                                <input type="text" id="form-code" placeholder="300308 或 00700" class="w-full px-4 py-3 bg-white border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6366f1] transition-all font-mono font-medium text-[#111827]">
                            </div>
                        </div>
                        <button type="button" onclick="handleAutoQuery(event)" class="w-full text-xs text-[#6366f1] hover:text-[#4f46e5] font-medium flex items-center justify-center gap-1.5 py-2 hover:bg-[#eef2ff] rounded-lg transition-all">
                            <i data-lucide="search" class="w-3.5 h-3.5"></i>
                            自动查询并填充信息
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-5">
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider">持仓股数</label>
                            <input type="number" id="form-count" required min="1" class="w-full px-4 py-3 bg-white border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6366f1] transition-all font-mono font-medium text-[#111827]">
                        </div>
                        <div class="space-y-1.5">
                            <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider">当前现价 <span class="text-[#9ca3af] font-normal">(选填)</span></label>
                            <div class="relative">
                                <span class="absolute left-4 top-3.5 text-[#9ca3af]">¥</span>
                                <input type="number" id="form-price" min="0" step="0.01" placeholder="留空自动查询" class="w-full pl-8 pr-4 py-3 bg-white border border-[#d1d5db] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6366f1] transition-all font-mono font-medium text-[#111827]">
                            </div>
                        </div>
                    </div>
                    
                    <!-- 标签输入区域 -->
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-[#6b7280] uppercase tracking-wider">

        const STORAGE_KEY = 'zen_stock_holdings';

        function loadFromStorage() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    state.stocks = parsed.stocks || [];
                }
            } catch (e) {
                console.error('加载数据失败:', e);
            }
            
            // 加载自动刷新偏好设置
            try {
                const autoRefresh = localStorage.getItem(AUTO_REFRESH_KEY);
                if (autoRefresh !== null) {
                    state.autoRefreshEnabled = autoRefresh === 'true';

            } catch (e) {
                console.error('加载自动刷新设置失败:', e);
            }
        }

        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({

                    lastUpdate: new Date().toISOString()

                console.error('保存数据失败:', e);

        // 导出数据为JSON文件
        function exportToJSON() {
            try {
                // 准备导出数据
                const exportData = {
                    stocks: state.stocks,
                    exportTime: new Date().toISOString(),
                    version: '1.0'
                };

                // 转换为JSON字符串，格式化输出
                const jsonString = JSON.stringify(exportData, null, 2);
                
                // 创建Blob对象
                const blob = new Blob([jsonString], { type: 'application/json' });
                
                // 创建下载链接
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                
                // 生成文件名（包含时间戳）
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
                link.download = `stock_holdings_${timestamp}.json`;
                
                // 触发下载
                document.body.appendChild(link);
                link.click();
                
                // 清理
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                console.log('✅ 数据导出成功');
            } catch (e) {
                console.error('导出数据失败:', e);
                alert('导出数据失败: ' + e.message);
            }
        }

        function switchTipsStrategy(strategyId) {
            state.currentTipsStrategy = strategyId;
            renderInvestmentTips();
        }

        function calculateStats() {
            // 计算总资产时，港股价格需要换算成人民币
            const totalAsset = state.stocks.reduce((acc, stock) => {
                const priceInCNY = stock.isHK ? stock.price * HKD_TO_CNY_RATE : stock.price;
                return acc + (stock.count * priceInCNY);
            }, 0);
            
            const strategyStats = {
                trend: { total: 0, count: 0 },
                core: { total: 0, count: 0 },
                reverse: { total: 0, count: 0 }
            };

            state.stocks.forEach(stock => {
                const priceInCNY = stock.isHK ? stock.price * HKD_TO_CNY_RATE : stock.price;
                const value = stock.count * priceInCNY;
                if (strategyStats[stock.strategy]) {
                    strategyStats[stock.strategy].total += value;
                    strategyStats[stock.strategy].count += 1;
                }
            });

            return { totalAsset, strategyStats };
        }

        // 渲染标签统计
        function renderTagsStatistics(totalAsset) {
            const container = document.getElementById('tags-statistics-content');
            if (!container) return;

            // 统计每个标签的持仓总价值
            const tagStats = {};
            
            state.stocks.forEach(stock => {
                if (stock.tags && stock.tags.length > 0) {
                    const priceInCNY = stock.isHK ? stock.price * HKD_TO_CNY_RATE : stock.price;
                    const assetVal = priceInCNY * stock.count;
                    
                    stock.tags.forEach(tag => {
                        if (!tagStats[tag]) {
                            tagStats[tag] = {
                                name: tag,
                                totalValue: 0,
                                count: 0
                            };
                        }
                        tagStats[tag].totalValue += assetVal;
                        tagStats[tag].count += 1;
                    });
                }
            });

            // 转换为数组并按价值排序
            const tagList = Object.values(tagStats).sort((a, b) => b.totalValue - a.totalValue);

            if (tagList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-[#9ca3af]">
                        <i data-lucide="tags" class="w-8 h-8 mx-auto mb-2 opacity-30"></i>
                        <p class="text-xs">暂无标签数据</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = `
                <div class="space-y-3">
                    ${tagList.map(tag => {
                        const percentage = totalAsset > 0 ? (tag.totalValue / totalAsset * 100).toFixed(1) : '0.0';
                        return `
                            <div class="bg-[#f9fafb] rounded-lg p-3 border border-[#e5e7eb] hover:border-[#6366f1]/30 transition-colors">
                                <div class="flex items-center justify-between mb-2">

                                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-[#f0f9ff] text-[#0369a1] border border-[#bae6fd]">
                                            ${tag.name}
                                        </span>
                                        <span class="text-xs text-[#9ca3af]">${tag.count}只</span>
                                    </div>
                                    <span class="text-xs font-bold text-[#6366f1]">${percentage}%</span>
                                </div>
                                <div class="flex items-baseline justify-between">
                                    <span class="text-xs text-[#9ca3af] uppercase tracking-wider">持仓价值</span>
                                    <span class="text-sm font-bold text-[#111827] font-mono">${formatMoney(tag.totalValue)}</span>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            
            lucide.createIcons();
        }

        function render() {
            const { totalAsset, strategyStats } = calculateStats();

            // 1. 更新总资产条
            document.getElementById('total-asset-display').textContent = formatMoney(totalAsset);
            document.getElementById('total-count-display').textContent = state.stocks.length;

            // 2. 渲染策略仪表盘（右侧垂直布局）
            const dashboard = document.getElementById('strategy-dashboard');
            dashboard.innerHTML = Object.values(STRATEGIES).map(strat => {
                const stratTotal = strategyStats[strat.id].total;

                    </div>
                </div>
                `;
            }).join('');

            // 3. 渲染标签统计
            renderTagsStatistics(totalAsset);

            // 4. 处理表格数据 (筛选 + 排序)
            let processed = state.stocks.filter(s => state.filter === 'all' || s.strategy === state.filter);
            
            processed.sort((a, b) => {
                let comparison = 0;
                if (state.sortConfig.key === 'strategy') {
                    const order = { trend: 1, core: 2, reverse: 3 };
                    comparison = order[a.strategy] - order[b.strategy];
                } else if (state.sortConfig.key === 'marketValue' || state.sortConfig.key === 'percentage') {
                    // 排序时使用换算后的价格
                    const aPriceInCNY = a.isHK ? a.price * HKD_TO_CNY_RATE : a.price;
                    const bPriceInCNY = b.isHK ? b.price * HKD_TO_CNY_RATE : b.price;
                    comparison = (aPriceInCNY * a.count) - (bPriceInCNY * b.count);
                }
                return state.sortConfig.direction === 'asc' ? comparison : -comparison;

            document.getElementById('view-count-display').textContent = processed.length;

            // 4. 渲染表格
            const tbody = document.getElementById('stock-table-body');

                tbody.innerHTML = `

            } else {
                tbody.innerHTML = processed.map(stock => {

                    // 港股价格换算成人民币计算市值
                    const priceInCNY = stock.isHK ? stock.price * HKD_TO_CNY_RATE : stock.price;
                    const assetVal = priceInCNY * stock.count;
                    const percent = formatPercent(assetVal, totalAsset);
                    
                    // 货币符号和标识
                    const currencySymbol = stock.isHK ? 'HK$' : '¥';
                    
                    return `
                    <tr id="stock-row-${stock.id}" class="hover:bg-[#f9fafb] transition-colors duration-150 group fade-in">
                        <td class="px-4 py-3 whitespace-nowrap">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium border ${strat.bgLight} ${strat.text} ${strat.border}">
                                ${strat.name.split(' ')[0]}
                            </span>
                        </td>
                        <td class="px-4 py-3">
                            <div class="flex flex-col">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="font-bold text-[#111827] text-sm">${stock.name}</span>
                                    ${stock.isHK ? '<span class="inline-flex items-center px-1 py-0.5 rounded text-[9px] font-bold bg-[#fef3c7] text-[#92400e]">HK</span>' : ''}
                                    ${stock.tags && stock.tags.length > 0 ? stock.tags.map(tag => `
                                        <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-[#f0f9ff] text-[#0369a1] border border-[#bae6fd]">
                                            ${tag}
                                        </span>
                                    `).join('') : ''}
                                </div>
                                <span class="text-xs text-[#9ca3af] font-mono mt-0.5">${stock.code}</span>
                            </div>
                        </td>
                        <td class="px-4 py-3 text-right" data-stock-id="${stock.id}" data-cell-type="market-value">
                            <div class="flex flex-col items-end">
                                <span class="font-bold text-[#111827] font-mono text-sm" data-value="${assetVal}">${formatMoney(assetVal)}</span>
                                <span class="text-xs text-[#9ca3af] mt-0.5">${percent}</span>
                            </div>
                        </td>
                        <td class="px-4 py-3 text-right" data-stock-id="${stock.id}" data-cell-type="price">
                            <div class="flex flex-col items-end">
                                <span class="text-sm text-[#4b5563] font-mono" data-price="${stock.price}">${currencySymbol}${stock.price}</span>
                                <span class="text-xs text-[#9ca3af] mt-0.5">${stock.count}股</span>
                            </div>
                        </td>
                        <td class="px-4 py-3 text-center">
                            <div class="flex items-center justify-center gap-1">
                                <button onclick="handleEdit(${stock.id})" class="text-[#d1d5db] hover:text-[#6366f1] transition-colors p-1.5 rounded-lg hover:bg-[#eef2ff]" title="编辑">
                                    <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                                </button>
                                <button onclick="handleDelete(${stock.id})" class="text-[#d1d5db] hover:text-[#ef4444] transition-colors p-1.5 rounded-lg hover:bg-[#fee2e2]" title="删除">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </td>
                    </tr>`;
                }).join('');
            }

            // 更新排序图标状态
            updateSortIcons();
            // 更新筛选按钮状态
            updateFilterButtons();
            
            // 重新初始化图标
            lucide.createIcons();
        }

        // --- 4. 交互处理 ---

        function handleSort(key) {
            if (state.sortConfig.key === key) {
                state.sortConfig.direction = state.sortConfig.direction === 'asc' ? 'desc' : 'asc';
            } else {
                state.sortConfig = { key, direction: 'asc' };
            }
            render();
        }

        function setFilter(filterType) {
            state.filter = filterType;
            // 同步更新投资要点显示
            state.currentTipsStrategy = filterType;
            renderInvestmentTips();
            render();
        }

        function handleDelete(id) {
            if(confirm('确定要删除这只股票吗？')) {
                state.stocks = state.stocks.filter(s => s.id !== id);
                saveToStorage();
                render();
                
                // 如果删除后没有股票了，停止定时刷新
                if (state.stocks.length === 0) {
                    stopAutoRefresh();
                }
            }
        }

        // 编辑股票
        function handleEdit(id) {
            const stock = state.stocks.find(s => s.id === id);
            if (!stock) return;

            // 填充表单
            document.getElementById('form-name').value = stock.name;
            document.getElementById('form-code').value = stock.code;
            document.getElementById('form-count').value = stock.count;
            document.getElementById('form-price').value = stock.price;
            document.getElementById('form-strategy').value = stock.strategy;
            document.getElementById('edit-stock-id').value = id;
            document.getElementById('form-isHK').value = stock.isHK ? 'true' : 'false';
            
            // 填充标签
            currentTags = stock.tags ? [...stock.tags] : [];
            renderTags();
            
            // 设置市场选择
            const marketValue = stock.isHK ? 'hk' : 'a';
            document.getElementById('form-market').value = marketValue;
            document.getElementById(`market-${marketValue}`).checked = true;
            
            // 更新策略按钮样式
            updateStrategyButtonStyles(stock.strategy);
            
            // 更新模态框标题
            document.getElementById('modal-title').textContent = '编辑持仓';
            document.getElementById('submit-btn-text').textContent = '确认修改';
            
            toggleModal(true);

        function toggleModal(show) {
            const modal = document.getElementById('add-modal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                // 关闭时重置表单和状态
                document.getElementById('add-stock-form').reset();
                document.getElementById('edit-stock-id').value = '';
                document.getElementById('form-isHK').value = 'false';
                document.getElementById('modal-title').textContent = '录入新持仓';
                document.getElementById('submit-btn-text').textContent = '确认添加';
                // 重置市场选择为A股
                document.getElementById('form-market').value = 'a';

                selectStrategy('trend');

                clearTags();

        function selectStrategy(stratId) {
            document.getElementById('form-strategy').value = stratId;
            updateStrategyButtonStyles(stratId);
        }

        function updateStrategyButtonStyles(selectedId) {
            const buttons = document.querySelectorAll('.strategy-btn');
            buttons.forEach(btn => {
                const val = btn.dataset.value;
                const s = STRATEGIES[val];
                
                // 重置样式
                btn.className = `strategy-btn relative flex flex-col items-center gap-2 py-4 px-2 rounded-xl border transition-all text-sm relative overflow-hidden`;
                
                if (val === selectedId) {
                    // 选中状态
                    btn.classList.add(...s.bgLight.split(' '), ...s.text.split(' '), 'ring-2', 'ring-offset-2', 'ring-transparent', 'shadow-sm', s.border);
                    // 添加选中标记
                    const indicator = document.createElement('div');
                    indicator.className = 'absolute top-0 right-0 w-3 h-3 rounded-bl-lg bg-current opacity-20';
                    btn.appendChild(indicator);
                } else {
                    // 未选中状态
                    btn.classList.add('bg-white', 'border-[#e5e7eb]', 'text-[#6b7280]', 'hover:border-[#d1d5db]', 'hover:bg-[#f9fafb]');
                    // 移除旧标记
                    const oldInd = btn.querySelector('div');
                    if(oldInd) oldInd.remove();
                }
            });
        }

        // --- 标签管理函数 ---
        let currentTags = []; // 当前表单中的标签列表

        function renderTags() {
            const container = document.getElementById('tags-container');
            if (!container) return;
            
            container.innerHTML = '';
            
            if (currentTags.length === 0) {
                container.innerHTML = '<span class="text-xs text-[#9ca3af] self-center">暂无标签</span>';
                return;
            }
            
            currentTags.forEach((tag, index) => {
                const tagEl = document.createElement('div');
                tagEl.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 bg-[#eef2ff] text-[#6366f1] rounded-md text-xs font-medium border border-[#6366f1]/20';
                tagEl.innerHTML = `
                    <span>${tag}</span>
                    <button type="button" onclick="removeTag(${index})" class="text-[#6366f1] hover:text-[#4f46e5] transition-colors">
                        <i data-lucide="x" class="w-3 h-3"></i>
                    </button>
                `;
                container.appendChild(tagEl);
            });
            
            lucide.createIcons();
        }

        function addTag() {
            const input = document.getElementById('tag-input');
            const tag = input.value.trim();
            
            if (!tag) return;
            
            if (currentTags.length >= 3) {
                alert('最多只能添加3个标签');
                return;
            }
            
            if (currentTags.includes(tag)) {
                alert('标签已存在');
                return;
            }
            
            if (tag.length > 10) {
                alert('标签长度不能超过10个字符');
                return;
            }
            
            currentTags.push(tag);
            input.value = '';
            renderTags();
        }

        function removeTag(index) {
            currentTags.splice(index, 1);
            renderTags();
        }

        function handleTagInputKeydown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                addTag();
            }
        }

        function clearTags() {
            currentTags = [];
            renderTags();
        }

        async function handleAddStock(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-stock-id').value;
            
            let name = document.getElementById('form-name').value.trim();
            let code = document.getElementById('form-code').value.trim();
            let count = Number(document.getElementById('form-count').value);
            let price = Number(document.getElementById('form-price').value) || 0;
            const strategy = document.getElementById('form-strategy').value;
            const market = document.getElementById('form-market').value;

            // 基本验证：必须有名称或代码
            if (!name && !code) {
                alert('请至少输入股票名称或代码');
                return;
            }

            if (count <= 0) {
                alert('请输入有效的持仓股数');
                return;
            }

            // 如果名称、代码或价格缺失，尝试自动查询
            let isHK = false; // 是否为港股
            let queriedFromAPI = false; // 标记是否从API查询过
            
            if (!name || !code || price === 0) {
                const keyword = name || code;
                showLoading(true);
                try {
                    const stockInfo = await queryStockInfo(keyword, market);
                    if (stockInfo) {
                        if (!name) name = stockInfo.name;
                        if (!code) code = stockInfo.code;
                        if (price === 0) price = stockInfo.price;
                        isHK = stockInfo.isHK || false; // 使用API返回的isHK字段
                        queriedFromAPI = true; // 标记已从API查询
                        
                        // 更新表单显示和隐藏字段
                        document.getElementById('form-name').value = name;
                        document.getElementById('form-code').value = code;
                        document.getElementById('form-price').value = price;
                        document.getElementById('form-isHK').value = isHK ? 'true' : 'false';
                    }
                } catch (err) {
                    alert('查询股票信息失败: ' + err.message);
                    showLoading(false);
                    return;
                }
                showLoading(false);
            }
            
            // 如果没有从API查询过，优先使用隐藏字段的值（可能是之前手动查询时保存的）
            if (!queriedFromAPI) {
                const savedIsHK = document.getElementById('form-isHK').value;
                if (savedIsHK === 'true') {
                    isHK = true;
                } else if (savedIsHK === 'false') {
                    isHK = false;
                } else {
                    // 如果隐藏字段也没有值，通过代码后缀判断
                    isHK = code.toUpperCase().includes('.HK');
                }
            }

            // 最终验证
            if (!name || !code || price <= 0) {
                alert('无法获取完整的股票信息，请检查输入');
                return;
            }
            
            // 获取标签（最多3个）
            const tags = currentTags.slice(0, 3);
            
            if (editId) {
                // 编辑模式
                const index = state.stocks.findIndex(s => s.id === Number(editId));
                if (index !== -1) {
                    state.stocks[index] = {
                        id: Number(editId),
                        name,
                        code: code || 'N/A',
                        count,
                        price,
                        strategy,
                        isHK: isHK,
                        tags: tags
                    };
                }
            } else {
                // 新增模式
                state.stocks.push({
                    id: Date.now(),
                    name,
                    code: code || 'N/A',
                    count,
                    price,
                    strategy,
                    isHK: isHK,
                    tags: tags
                });
            }

            saveToStorage();
            
            // 重置表单
            e.target.reset();
            document.getElementById('edit-stock-id').value = '';
            document.getElementById('form-isHK').value = 'false';
            clearTags(); // 清空标签
            // 恢复默认策略选择
            selectStrategy('trend');
            // 恢复模态框标题
            document.getElementById('modal-title').textContent = '录入新持仓';
            document.getElementById('submit-btn-text').textContent = '确认添加';
            
            toggleModal(false);
            render();
            
            // 如果是新增股票且之前没有股票，启动定时刷新
            if (!editId && state.stocks.length === 1) {
                startAutoRefresh();
            }
        }

        // 查询股票信息
        async function queryStockInfo(keyword, market) {
            try {
                let url = `/api/stock/query?keyword=${encodeURIComponent(keyword)}`;
                if (market) {
                    url += `&market=${market}`;
                }
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.success) {
                    return result.data;
                } else {
                    throw new Error(result.error || '查询失败');
                }
            } catch (err) {
                console.error('查询股票信息失败:', err);
                throw err;
            }
        }

        // 显示/隐藏加载状态
        function showLoading(show) {
            const submitBtn = document.querySelector('#add-stock-form button[type="submit"]');
            if (show) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> 查询中...';
                lucide.createIcons();
            } else {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i data-lucide="plus" class="w-5 h-5"></i> <span id="submit-btn-text">确认添加</span>';
                lucide.createIcons();
            }
        }

        // 处理市场选择变化
        function handleMarketChange(market) {
            document.getElementById('form-market').value = market;
            // 清空之前查询的结果，让用户重新查询
            if (market !== '') {
                // 如果选择了特定市场，可以提示用户重新查询
                console.log('市场已切换为:', market === 'a' ? 'A股' : market === 'hk' ? '港股' : '全部');
            }
        }

        // 手动触发自动查询
        async function handleAutoQuery(event) {
            const name = document.getElementById('form-name').value.trim();
            const code = document.getElementById('form-code').value.trim();
            const market = document.getElementById('form-market').value;
            
            if (!name && !code) {
                alert('请先输入股票名称或代码');
                return;
            }

            const keyword = name || code;
            const btn = event.target.closest('button');
            const originalHTML = btn.innerHTML;
            
            // 显示加载状态
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> 查询中...';
            lucide.createIcons();
            
            try {
                const stockInfo = await queryStockInfo(keyword, market);
                if (stockInfo) {
                    document.getElementById('form-name').value = stockInfo.name;
                    document.getElementById('form-code').value = stockInfo.code;
                    // 只有当价格大于0时才填充
                    if (stockInfo.price > 0) {
                        document.getElementById('form-price').value = stockInfo.price;
                    }
                    // 保存isHK信息到隐藏字段
                    document.getElementById('form-isHK').value = stockInfo.isHK ? 'true' : 'false';
                    
                    // 显示成功提示
                    btn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i> 查询成功';
                    btn.classList.add('text-[#10b981]');
                    lucide.createIcons();
                    
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                        btn.classList.remove('text-[#10b981]');
                        btn.disabled = false;
                        lucide.createIcons();
                    }, 2000);
                }
            } catch (err) {
                alert('查询失败: ' + err.message);
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        // --- 5. 辅助 UI 更新 ---
        function updateSortIcons() {
            ['strategy', 'marketValue', 'percentage'].forEach(key => {
                const icon = document.getElementById(`sort-icon-${key}`);
                if (!icon) return;
                
                // 重置
                icon.className = "w-3.5 h-3.5 text-[#9ca3af] opacity-40 group-hover:opacity-100 transition-opacity";
                icon.setAttribute('data-lucide', 'arrow-up-down');

                if (state.sortConfig.key === key) {
                    icon.className = "w-3.5 h-3.5 text-[#6366f1]";
                    icon.setAttribute('data-lucide', state.sortConfig.direction === 'asc' ? 'arrow-up' : 'arrow-down');
                }
            });
        }

        function updateFilterButtons() {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                const type = btn.dataset.filter;
                if (type === state.filter) {
                    btn.className = "filter-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 bg-white text-[#6366f1] shadow-sm ring-1 ring-[#e5e7eb]";
                } else {
                    btn.className = "filter-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all duration-200 text-[#6b7280] hover:text-[#111827] hover:bg-[#e5e7eb]/50";
                }
            });
        }

        // --- 6. 定时刷新股价功能 ---
        
        // 批量刷新股价
        async function refreshStockPrices() {
            if (state.stocks.length === 0 || state.isRefreshing) {
                return;
            }

            state.isRefreshing = true;
            
            // 更新刷新指示器状态
            const indicator = document.getElementById('refresh-indicator');
            if (indicator) {
                indicator.innerHTML = `
                    <i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i>
                    <span>刷新中...</span>
                `;
                lucide.createIcons();
            }

            try {
                // 准备批量查询的数据
                const stocksToQuery = state.stocks.map(stock => ({
                    code: stock.code,
                    isHK: stock.isHK || false
                }));

                console.log('🔍 [批量查询] 发送数据:', stocksToQuery);

                // 调用批量查询接口
                const response = await fetch('/api/stock/batch-prices', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ stocks: stocksToQuery })
                });

                const result = await response.json();
                console.log('📥 [批量查询] 返回结果:', result);

                if (result.success && result.data) {
                    // 计算总资产（用于百分比）
                    const { totalAsset } = calculateStats();
                    
                    // 更新股价（只更新DOM，不重新渲染整个表格）
                    let hasUpdate = false;
                    result.data.forEach(priceData => {
                        const stock = state.stocks.find(s => s.code === priceData.code);
                        if (stock && priceData.price > 0) {
                            const oldPrice = stock.price;
                            const newPrice = priceData.price;
                            
                            if (oldPrice !== newPrice) {
                                // 更新数据
                                stock.price = newPrice;
                                hasUpdate = true;
                                
                                // 计算新市值
                                const priceInCNY = stock.isHK ? newPrice * HKD_TO_CNY_RATE : newPrice;
                                const newAssetVal = priceInCNY * stock.count;
                                const newPercent = formatPercent(newAssetVal, totalAsset);
                                
                                // 更新DOM - 价格单元格
                                const priceCell = document.querySelector(`td[data-stock-id="${stock.id}"][data-cell-type="price"]`);
                                if (priceCell) {
                                    const priceSpan = priceCell.querySelector('span[data-price]');
                                    if (priceSpan) {
                                        const currencySymbol = stock.isHK ? 'HK$' : '¥';
                                        priceSpan.textContent = `${currencySymbol}${newPrice}`;
                                        priceSpan.setAttribute('data-price', newPrice);
                                    }
                                    
                                    // 添加闪烁动画
                                    if (newPrice > oldPrice) {
                                        priceCell.classList.add('price-up');
                                    } else {
                                        priceCell.classList.add('price-down');
                                    }
                                    
                                    // 动画结束后移除类
                                    setTimeout(() => {
                                        priceCell.classList.remove('price-up', 'price-down');
                                    }, 1200);
                                }
                                
                                // 更新DOM - 市值单元格
                                const marketValueCell = document.querySelector(`td[data-stock-id="${stock.id}"][data-cell-type="market-value"]`);
                                if (marketValueCell) {
                                    const valueSpan = marketValueCell.querySelector('span[data-value]');
                                    const percentSpan = marketValueCell.querySelectorAll('span')[1];
                                    
                                    if (valueSpan) {
                                        valueSpan.textContent = formatMoney(newAssetVal);
                                        valueSpan.setAttribute('data-value', newAssetVal);
                                    }
                                    if (percentSpan) {
                                        percentSpan.textContent = newPercent;
                                    }
                                    
                                    // 添加闪烁动画
                                    if (newPrice > oldPrice) {
                                        marketValueCell.classList.add('price-up');
                                    } else {
                                        marketValueCell.classList.add('price-down');
                                    }
                                    
                                    // 动画结束后移除类
                                    setTimeout(() => {
                                        marketValueCell.classList.remove('price-up', 'price-down');
                                    }, 1200);
                                }
                                
                                console.log(`💹 [价格变动] ${stock.name}: ${oldPrice} → ${newPrice} (${newPrice > oldPrice ? '↑' : '↓'})`);
                            }
                        }
                    });

                    // 如果有更新，保存到本地并更新总资产显示
                    if (hasUpdate) {
                        saveToStorage();
                        
                        // 只更新总资产和统计信息，不重新渲染表格
                        const { totalAsset: newTotalAsset, strategyStats } = calculateStats();
                        document.getElementById('total-asset-display').textContent = formatMoney(newTotalAsset);
                        
                        // 更新策略仪表盘
                        const dashboard = document.getElementById('strategy-dashboard');
                        dashboard.innerHTML = Object.values(STRATEGIES).map(strat => {
                            const stratTotal = strategyStats[strat.id].total;
                            const percentage = newTotalAsset > 0 ? (stratTotal / newTotalAsset) * 100 : 0;
                            
                            return `
                            <div class="bg-white rounded-xl p-5 shadow-sm border border-[#e5e7eb] hover:shadow-md transition-all duration-200 relative overflow-hidden">
                                <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b ${strat.gradient}"></div>
                                <div class="pl-3">
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="flex items-center gap-2">
                                            <div class="p-2 rounded-lg ${strat.bgLight} ${strat.text}">
                                                <i data-lucide="${strat.icon}" class="w-4 h-4"></i>
                                            </div>
                                            <div>
                                                <h3 class="font-bold text-[#111827] text-sm">${strat.name.split(' ')[0]}</h3>
                                                <p class="text-[10px] text-[#6b7280]">${strat.desc}</p>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-2xl font-bold ${strat.text}">${percentage.toFixed(0)}</span>
                                            <span class="text-xs text-[#9ca3af] font-medium">%</span>
                                        </div>
                                    </div>
                                    <div class="flex items-baseline justify-between pt-3 border-t border-[#f3f4f6]">
                                        <span class="text-xs text-[#9ca3af] uppercase tracking-wider">资产</span>
                                        <span class="text-lg font-bold text-[#111827]">${formatMoney(stratTotal)}</span>
                                    </div>
                                </div>
                            </div>
                            `;
                        }).join('');
                        
                        lucide.createIcons();
                        
                        // 更新标签统计
                        renderTagsStatistics(newTotalAsset);
                        
                        console.log('✅ 股价已更新:', new Date().toLocaleTimeString());
                        
                        // 显示成功状态
                        if (indicator) {
                            indicator.innerHTML = `
                                <i data-lucide="check-circle" class="w-3.5 h-3.5 text-[#10b981]"></i>
                                <span class="text-[#10b981]">已更新</span>
                            `;
                            lucide.createIcons();
                            
                            // 2秒后恢复正常状态
                            setTimeout(() => {
                                indicator.innerHTML = `
                                    <i data-lucide="activity" class="w-3.5 h-3.5"></i>
                                    <span>实时刷新</span>
                                `;
                                lucide.createIcons();
                            }, 2000);
                        }
                    } else {
                        // 没有更新
                        if (indicator) {
                            indicator.innerHTML = `
                                <i data-lucide="activity" class="w-3.5 h-3.5"></i>
                                <span>实时刷新</span>
                            `;
                            lucide.createIcons();
                        }
                    }
                }
            } catch (error) {
                console.error('❌ 刷新股价失败:', error);
                
                // 显示错误状态
                if (indicator) {
                    indicator.innerHTML = `
                        <i data-lucide="alert-circle" class="w-3.5 h-3.5 text-[#ef4444]"></i>
                        <span class="text-[#ef4444]">刷新失败</span>
                    `;
                    lucide.createIcons();
                    
                    // 3秒后恢复正常状态
                    setTimeout(() => {
                        indicator.innerHTML = `
                            <i data-lucide="activity" class="w-3.5 h-3.5"></i>
                            <span>实时刷新</span>
                        `;
                        lucide.createIcons();
                    }, 3000);
                }
            } finally {
                state.isRefreshing = false;
            }
        }

        // 启动定时刷新
        function startAutoRefresh() {
            // 如果自动刷新未启用，不启动
            if (!state.autoRefreshEnabled) {
                return;
            }
            
            // 清除已有的计时器
            if (state.refreshTimer) {
                clearInterval(state.refreshTimer);
            }

            // 立即执行一次刷新
            refreshStockPrices();

            // 每5秒刷新一次
            state.refreshTimer = setInterval(() => {
                if (state.autoRefreshEnabled) {
                    refreshStockPrices();
                } else {
                    stopAutoRefresh();
                }
            }, 5000);

            console.log('🔄 已启动定时刷新（每5秒）');
        }

        // 停止定时刷新
        function stopAutoRefresh() {
            if (state.refreshTimer) {
                clearInterval(state.refreshTimer);
                state.refreshTimer = null;
                console.log('⏸️ 已停止定时刷新');
            }
        }

        // 页面可见性变化时的处理
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // 页面隐藏时停止刷新
                stopAutoRefresh();
            } else {
                // 页面显示时恢复刷新
                if (state.stocks.length > 0) {
                    startAutoRefresh();
                }
            }
        });

        // --- 启动 ---
        init();
    </script>
</body>
</html>
